# --- release packaging inputs ---------------------------------------------
# Neither of these is a build dependency: nothing here is compiled, fetched by
# the 00-06 pipeline, or linked into the image. They are inputs to the two
# DELIVERY FORMATS that wrap the already-built canonical core, and they live
# here because this file is the shipping-dependency authority and a pin that
# lives in a script is a pin nobody audits.

# The official Ender-3 V3 KE Ingenic Cloner recovery package. NebulaOS does not
# build an .ingenic from scratch - it substitutes the canonical xImage and
# rootfs.squashfs into this vendor package and carries everything else through
# untouched: SPL/U-Boot, the MBR/GPT, the per-SoC firmware and DDR descriptors,
# the Cloner files, the security keys.
#
# Pinned BY CONTENT because that is what matters: a substituted template would
# put unknown boot material into a recovery package aimed at a printer in
# mask-ROM mode. scripts/package/build-ingenic.py refuses any other template
# unless explicitly overridden for local experimentation.
#
# Distributed as a Git LFS object; the sha256 below is both the LFS oid and the
# file's own digest, so `sha256sum` on a downloaded copy verifies it directly.
# Deliberately NOT vendored into this repository: it is 124 MB of redistributed
# vendor firmware.
INGENIC_TEMPLATE_NAME=Ender-3_V3_KE_1.1.0.12.ingenic
INGENIC_TEMPLATE_REPO=https://github.com/OpenKlipperEdition/Recovery.git
INGENIC_TEMPLATE_PATH=Ender-3_V3_KE_1.1.0.12.ingenic
INGENIC_TEMPLATE_SHA256=5388b16810e51c8233d6ee978b5b4a09347a4c9a4a516d3c5bf8c686e6783f3c
INGENIC_TEMPLATE_SIZE=130364076

# The RTOS image (zero.bin) SPL loads before Linux, and NebulaOS's one change
# to it. SPL reads the OTA marker and loads rtos2 (p4) for ota:kernel2 and rtos
# (p3) otherwise (SPL disassembly, _analysis/gui-service-audit/14-*). So the
# image NebulaOS ships for its own slot - zero2.bin in the .ingenic, the rtos
# record in the .img - is the stock image with the 480x272 boot-logo JPEG
# (offset 0x5e50c, 10899 bytes) replaced by NebulaOS's and zero-padded; every
# other byte is stock. Slot A's zero.bin stays byte-exact stock, and the
# Hardware Agent never writes rtos (p3).
#   STOCK      images/zero.bin inside the pinned INGENIC_TEMPLATE
#   LOGO       scripts/package/assets/nebulaos-rtos-logo.jpg (make-rtos-logo.py)
#   NEBULAOS   STOCK + LOGO via scripts/package/rtos_logo.py
# The same values are constants in rtos_logo.py (packaging and the Hardware
# Agent's rtos-logo operation use them); tests/release-packaging-tests.sh fails
# when the two disagree. Changing the logo changes both LOGO and NEBULAOS.
RTOS_STOCK_ZERO_SHA256=2a6b8fcdc7acb73eb7c0fe660906c94989b9f1fb2a3436f3c897766e18dfc340
RTOS_STOCK_ZERO_SIZE=432824
RTOS_NEBULAOS_LOGO_SHA256=78341088f844990e0efd1ae2efa1dae618516c1639a48381ac270b1c8c671096
RTOS_NEBULAOS_ZERO_SHA256=bd29e775897b21f77ad4aa03d981ef57bc69e2a92f287e488935c0f6a5d76506

# The Ingenic USB mask-ROM tool used for out-of-band recovery. Previously
# documented in docs/DEVELOPER_RECOVERY.md as a bare `git clone` with no
# revision at all, which meant "the recovery path" named whatever upstream
# happened to be that day. Pinned here; the repository's own
# patches/ingenic-usbboot-write-partition.patch applies on top and adds
# mmc_write_partition() (chunked write with immediate per-chunk read-back
# verification) plus libusb control-transfer retry for the post-write
# LIBUSB_ERROR_TIMEOUT seen on real hardware.
