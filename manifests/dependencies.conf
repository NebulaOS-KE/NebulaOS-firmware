# (the v0.13.0 API) with runtime detection for forward compatibility.
# Extension suite passes against this commit composed; required_klipper_-
# symbols updated to match. This is the qualification candidate.
#
# 2026-08-23 (Phase 1.8B host-upgrade mission): advanced from v0.13.0
# (61c0c8d2ef) to 58bd67db3, the same official upstream commit the
# native GD32F303 MCU firmware (NebulaOS-klipper-mcu) is built from.
# The v0.13.0 host cannot configure against the native MCU because the
# host/MCU protocol changed between those two commits (observed:
# KeyError: 'bytes_per_report' / Unable to encode: query_analog_in).
# The correct fix is moving the host to match the MCU's upstream base,
# not patching either side. Extensions are re-qualified against this
