# fe4eb8650b, tagged v0.13.0-734-gfe4eb865, 588 commits past the point the
# retired fork's lineage diverged from mainline. NOT a fast-forward of the
# old pin - it is a different repository, so the usual ancestor-chain note
# does not apply and cannot.
#
# 2026-08-20 (Phase 1.5 hardware closure): rolled back from fe4eb8650b to
# the official v0.13.0 tag (61c0c8d2ef). Moving 734 commits back to the
# last released tag removes two API differences the extensions had to
# bridge (register_serial_response/check_valid_response, both absent at
