# The PIN above is upstream's tip as of 2026-09-29 ("Fixed SPL to enable serial
# console input.", committed 2024-02-08) - this repository has been dormant for
# some time, which is exactly why naming a revision costs nothing and settles it.
#
# NOT YET CONSUMED BY ANY BUILD OR TOOL. Recorded now so the USB recovery
# backend, when it is written, starts from a pinned upstream rather than
# inventing one. An earlier revision of this block claimed "Pinned here" while
# recording only a URL - a claim the shipping-authority file should never make
# loosely, and one an independent review caught.
INGENIC_USBBOOT_REPO=https://github.com/ballaswag/ingenic-usbboot.git
