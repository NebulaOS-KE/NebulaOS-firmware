# --- Klipper runtime (OFFICIAL, unmodified Klipper3d/klipper - NOT a fork) ---
#
# 2026-08-17 (Phase 1 no-fork migration): KLIPPER_REPO moved from
# coreflake1/NebulaOS-klipper to the official upstream. This is the headline
# change of the whole Phase 1 architecture, and it is not a cosmetic
# re-pointing: NebulaOS no longer hosts a Klipper fork at all. Everything
# this project owns (at the time of that migration: PRTouch, z-compensation,
# TMC status, the vendored community extras - PRTouch has since been removed
# entirely, see the contents note below) moved to KLIPPER_EXTENSIONS_REPO
# below and is
# activated at boot by symlink composition into this checkout's
# klippy/extras/, listed in that clone's own .git/info/exclude so the
# checkout stays content-pristine. See
# _project/missions/2026-08-phase1-klipper-no-fork-analysis.md for the
# feasibility proof and docs/NEBULAOS_KLIPPER_COMPOSITION.md for how the
# runtime side works.
#
# Core Klipper file patches still required under this architecture: ZERO.
# The three the old fork carried each dissolve for a different reason -
# TRSYNC_TIMEOUT is provably unreachable on a single-MCU printer (mainline
# selects TRSYNC_SINGLE_MCU_TIMEOUT instead), chelper is a firmware
# packaging problem solved by the mtime invariant in
# /etc/nebulaos-chelper-preflight.sh, and the GD32 die-temperature curves
# register through heaters.add_sensor_factory() from an ordinary external
# extra.
#
# A direct consequence worth stating plainly: Moonraker's reserved
# [update_manager klipper] slot hardcodes origin =
# https://github.com/Klipper3d/klipper.git and does not allow it to be
# overridden. The old fork therefore tripped Moonraker's "Unofficial remote
# url" anomaly on every refresh, by construction. Pointing at the official
# remote REMOVES a divergence rather than creating one.
#
# The pin below is the qualification candidate, and it is what
# [update_manager klipper]'s pinned_commit in
# printer_data/config/nebulaos/klipper-pin.conf must match. Moving it is a
# deliberate act with a fixed procedure (compose, run the extension suite,
# re-verify required_klipper_symbols, rebuild c_helper.so, re-qualify on
# hardware, then move both the pin and the manifest together) - see
# NebulaOS-klipper-extensions/docs/COMPATIBILITY.md's "Moving the qualified
# pin".
#
# HISTORICAL - the fork's own pin history is preserved below for
# provenance. coreflake1/NebulaOS-klipper is NOT deleted or archived by
# this change; it remains the historical fork of record, and the extension
# repository carries its real filtered history.
#
# 2026-08-07 baseline-repair mission: bumped from d839d0375a31327e57e0a35e-
# 99e70ba60814ec05 to the commit that reconciles this fork's tracked
# klippy/extras/ with what's actually running on the real printer (the
# z_compensate structured status contract + the load-cell config
# reconciliation fixes, previously local-only/manually-deployed - see
# scripts/build/apply-qualified-baseline.sh's own mission history and
# docs/NEBULAOS_QUALIFIED_BASELINE_VARIANT_AUDIT.md).
#
# Pushed 2026-08-07 (confirmed resolvable from a fresh clone as part of
# this mission's own clean-room reproducibility test).
#
# 2026-08-07 (clean-update mission): KLIPPER_BRANCH switched from
# `nebulaos` to `master` - real bug found live: Moonraker's reserved
# `[update_manager klipper]` slot auto-discovers path/branch from the
# live checkout, and the device's persistent checkout was on `master`
# (the branch Moonraker/factory-seed have always assumed is canonical -
# see S04nebulaos-factory-seed's own doc comment), which was still
# sitting at the OLD pinned commit while every accepted fix landed on a
# separate `nebulaos` side-branch. Fast-forwarded master to the accepted
# HEAD (pure linear fast-forward, verified: master's old tip is a direct
# ancestor of this pin, zero rebase/force-push) rather than repointing
# Moonraker at a second branch - one canonical branch, not two.
# `nebulaos` still exists (unchanged, not deleted/rewritten) as a
# historical record of where this exact commit was first pushed.
#
# 2026-08-08 (Final Baseline Closure mission): bumped from 462fd689 to
# 845396f0, which untracks klippy/chelper/c_helper.so and restores
# upstream Klipper's own `*.so` .gitignore entry (this fork had it
# commented out). Pure linear fast-forward on master (verified: 462fd689
# is a direct ancestor). See docs/NEBULAOS_C_HELPER_DIRTY_STATE_FIX.md
# for the full root-cause writeup (read directly from the pinned
# Moonraker source) of why a tracked, always-different cross-compiled
# binary made Moonraker's own update_manager report Klipper as
# permanently dirty/invalid on every real device.
#
# 2026-08-09 (load-cell safety hardening mission): bumped from 845396f0 to
# 4510ee65, the mirror commit of this repo's own klippy_extras/ changes -
# see docs/NEBULAOS_LOADCELL_SAFETY_HARDENING.md. Real process gap found
# and closed this mission: this repo's own klippy_extras/ directory is
# NOT injected at build time (04-cross-compile-app-stack.sh's own comment,
# confirmed by direct rootfs inspection - a build from a clean klippy_extras/
# edit alone silently shipped the OLD, pre-mission prtouch_probe.py with
# none of this mission's fixes) - vendor/klipper's own klippy/extras/,
# pulled via this exact pin, is the real build input. klippy_extras/ here
# remains the reviewable mirror; a real deployment always needs both
# commits, in both repos, kept in sync. Pure linear fast-forward on master
# (verified: 845396f0 is a direct ancestor).
#
# 2026-09-21 CORRECTION to the paragraph above, which is a dated record and
# is kept as written: its closing clause has stopped being true and must not
# be followed. There is no klippy_extras/ mirror in this repository any more
# - it was deleted (audit finding F-05) because it had DIVERGED from the
# modules that actually ship, and one test was still validating the shipped
# printer.cfg against it. There is nothing to "keep in sync", and host
# Klipper is now official Klipper3d/klipper rather than a NebulaOS fork.
# The extension modules are owned by NebulaOS-klipper-extensions, fetched at
# KLIPPER_EXTENSIONS_PIN, and composed into klippy/extras/ as manifest-driven
# symlinks by scripts/build/overlay/etc/nebulaos-klipper-compose.sh. To change
# one: edit the extensions repository, then advance KLIPPER_EXTENSIONS_PIN.
KLIPPER_REPO=https://github.com/Klipper3d/klipper.git
KLIPPER_BRANCH=master
