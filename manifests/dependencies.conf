# Klipper3d/klipper master branch.
KLIPPER_PIN=58bd67db3ce1be1951c3e4a6d1156a79903d4edc

# --- NebulaOS Klipper extensions (everything this project actually owns) ---
#
# 2026-08-17 (Phase 1 no-fork migration): the third image-owned source
# component, alongside Klipper and Moonraker. Seeded, migrated, activated,
# validated, locked and rolled back through the exact same machinery as
# those two - it is not a special case with a parallel lifecycle.
#
# Contents (authoritative list: that repo's nebulaos-extensions.json - 34
# managed modules, 17 role=runtime and 17 role=test): z_compensate, the
# nozzle-contact/calibration set (nozzle_clear, nebulaos_z_offset_probe,
# nebulaos_probe_pair, nebulaos_calibration, nebulaos_calibration_journal),
# power-loss recovery (nebulaos_power_loss_recovery, nebulaos_plr_journal),
# nebulaos_version, the compatibility preflight (nebulaos_compat), the GD32
# die-temperature module (nebulaos_temperature_mcu), five vendored community
# modules with real attribution in that repo's VENDORED.md (tmcstatus,
# gcode_shell_command, virtual_pins, calibrate_shaper_config, bl24c16f), and
# prtouch_test_support (offline test scaffolding; carries role=runtime because
# role means "must be present and composed", not "executes on the printer" -
# the name is legacy). That is the full 17. The PRTouch probe STACK
# (prtouch_v2/_probe/_mcu/_nozzle/_calibration/_units/_safety_guard) was
# deleted in Phase 1.8B and none of it remains. Real filtered history from the retired fork,
# so per-file git blame and the load-cell safety-hardening series both survive.
#
# The pin here and Klipper's pin above are ONE unit. The update supervisor
# validates, records and rolls back the (klipper, extensions) pair together
# and never records a known-good pair until both halves have passed - a
# half-updated pair is exactly where the chelper failure and the
# register_response -> register_serial_response API rename land.
# Phase 2 final software closure mission (2026-09-09): was `main` - broke
# Moonraker's update_manager validity check (is_valid: false, "diverged
# from remote") the moment KLIPPER_EXTENSIONS_PIN below advanced past
# main's own tip, because at the time this was fixed, in-development phase
# work was never merged to main (see the "bump the pin on a feature branch
# without merging to main" comment just below, a pattern this repo has
# since retired - the Phase 2 repository consolidation mission, also
# 2026-09-09, promoted the qualified phase branch straight onto main).
# `production` stays a dedicated branch regardless of that policy change:
# Moonraker's own update_manager compares the local checkout against
# whatever `primary_branch` names, so it needs a real, always-advancing
# remote branch to track - `production` is fast-forwarded to whatever
# commit is currently pinned below whenever the pin advances (in steady
# state, the same commit main already points at) - see
# docs/NEBULAOS_EXTENSIONS_BRANCH_STRATEGY.md.
KLIPPER_EXTENSIONS_REPO=https://github.com/coreflake1/NebulaOS-klipper-extensions.git
KLIPPER_EXTENSIONS_BRANCH=production
