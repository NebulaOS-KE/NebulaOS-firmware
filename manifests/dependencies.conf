KERNEL_CONFIG_PROFILE=production

# --- Buildroot config for this board family ---
# 2026-09-27 (Buildroot 2025.02.18 migration): moved from the vendor fork
# lone0/buildroot-x2000 (Buildroot 2023.11.1 plus three commits) to OFFICIAL
# upstream Buildroot at the 2025.02 LTS tip. The fork's entire divergence from
# upstream was four tracked files - configs/halley5_x2000_defconfig and three
# board/halley5/patches/linux/*.patch - and the patches were proven inert (a
# package with <PKG>_OVERRIDE_SRCDIR is rsynced, not extracted-and-patched:
# package/pkg-generic.mk ties _TARGET_CONFIGURE to _TARGET_RSYNC, and the built
# tree has .stamp_rsynced with no .stamp_patched). Nothing NebulaOS-specific
