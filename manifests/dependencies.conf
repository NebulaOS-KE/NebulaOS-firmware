# 2026-10-11 (Q2, D10): 1a2c558 -> d3cdc47, defconfig only - no Ingenic boot
# logo (CONFIG_TRUE_COLOR_LOGO off) and the framebuffer console reverted
# (it existed only for the removed console boot mode).
KERNEL_PIN=d3cdc473e309cf1eb0e0fd4978e1673747adc02d
# Kernel configuration profile (SOT-51). production = the kernel-owned
# nebulaos_halley5_v30_defconfig as is. diagnostic = the same plus
# arch/mips/configs/nebulaos_halley5_v30_diagnostic.config (tracers, PSI,
# SCHEDSTATS, DEBUG_ATOMIC_SLEEP, LOCALVERSION -diag). A diagnostic build is
