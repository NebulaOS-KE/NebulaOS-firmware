# NebulaOS (ke-mainline-klipper) - Moonraker config for the app-stack proof-of-
# pipeline build (FIRMWARE.md sec 13). klippy_uds_address matches the
# APISOCK path in S55klipper's own invocation of klippy.py.

[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /opt/printer_data/comms/klippy.sock

# Without enable_object_processing, exclude_object's per-object polygons
# are never populated from sliced gcode metadata, so print.cfg's adaptive
# bed mesh, _SMART_PARK and _LINE_PURGE fall back to their safe empty-list
# defaults (full bed mesh, park/purge at bed origin) instead of
# print-area-aware behavior.
[file_manager]
enable_object_processing: True

# OpenKE addition (FIRMWARE.md sec 13, stock-parity investigation): without
# a [machine] section, Moonraker defaults to the "systemd_cli" provider,
# which fails outright on this Buildroot/BusyBox image ("The name
# org.freedesktop.systemd1 was not provided by any .service files") since
# there's no systemd or D-Bus service manager here. Stock's own real
# Moonraker install (Creality-Helper-Script, /usr/data/printer_data/config/
# moonraker.conf on the same physical device) uses the exact same values
# below, paired with a real, proven /usr/bin/supervisorctl shim (see that
# file's own header) that drives our /etc/init.d/S* scripts directly - no
# systemd, no real supervisord daemon needed either. validate_service/
# validate_config are real Moonraker options (not warning suppression);
# stock disables them because supervisorctl.d config-file validation
# doesn't apply to this shim.
[machine]
provider: supervisord_cli
validate_service: False
validate_config: False

# USB/webcam stock-parity mission (2026-07-26), corrected by the Moonraker
# update/camera implementation mission (2026-07-27, see
# docs/NEBULAOS_MOONRAKER_UPDATE_AND_CAMERA_ANALYSIS.md): there is
# deliberately no active [webcam ...] section here anymore. A config-defined
# webcam is re-parsed from this file on every single Moonraker startup (it
# is NOT copied into the database "the first time it sees it" - a prior
# comment here claimed exactly that and was factually wrong, confirmed
# directly against vendor/moonraker's webcam.py source) and is permanently
# forbidden from being edited or deleted via the webcam API for as long as
# any [webcam ...] section defines it - a hard Moonraker server-side rule
# (WebcamManager._handle_webcam_request's own source=="config" check), not
# a Mainsail UI choice. NebulaOS's own default camera is instead seeded
# once into Moonraker's database (source="database") by
# S57nebulaos-camera-seed, the first time Moonraker is confirmed healthy -
# see that script for the exact one-time, idempotent, marker-guarded seed
# logic. A database-sourced camera is fully editable/deletable through
# Mainsail like any user-added camera, and a deliberate user deletion is
# never reversed by a later boot (the seed marker prevents recreation).

# NebulaOS mutable-runtime mission, Phase 10: Update Manager. Shape
# confirmed directly against SimpleAF's own real, currently-shipping
# k1/moonraker.conf (pellcorp/creality) - enable_system_updates: False,
# enable_auto_refresh: False match exactly (no general Linux package
# updater ever exposed through Moonraker; auto-refresh left to an explicit
# user/Mainsail-triggered check rather than a background poll, same as the
# reference). Klipper/Moonraker as git-repo/dev-channel updates and
# Mainsail as a release/beta-channel update both match that reference's
# shape.
#
# Phase 1 no-fork migration (2026-08-17) changed the Klipper half of this
# deliberately. Klipper and its extension set are now pinned to a qualified
# pair (in /etc/nebulaos/moonraker/klipper-pin.conf), where before neither
# carried a pin at all. Moonraker itself is unchanged and stays unpinned.
#
# The old reasoning was that compatibility control came from the two-stage
# health check and rollback rather than a pin. That machinery is still
# there and still does its job, but it is a DETECTOR, and detection is the
# wrong primary defence for this particular risk. NebulaOS now runs official
# mainline Klipper, which means an unpinned update can move the printer
# hundreds of commits across independent refactors of probe.py, toolhead.py,
# mcu.py and motion_queuing - underneath a load-cell probe that drives the
# nozzle into a heated bed, on a project that already has one documented
# MCU-timer incident. An unqualified Klipper bump is a physical-safety
# change wearing the costume of a version update, and rolling it back after
# the fact is not the same as never reaching it.
#
# So the pin prevents, and the health check plus paired rollback catch what
# the pin cannot. Moving the pin stays a deliberate act with a fixed
# procedure, including hardware re-qualification - see
# NebulaOS-klipper-extensions/docs/COMPATIBILITY.md. NebulaScreen (the
# touchscreen, formerly GuppyScreen) has no section in this user-owned file:
# its [update_manager nebulascreen] section is image-owned
# (/etc/nebulaos/moonraker/nebulascreen-update.conf, included from
# /etc/nebulaos/moonraker/nebulaos.conf once a first release exists), and
# without a downloaded release the image's own /opt/nebulascreen copy runs.
[update_manager]
enable_auto_refresh: False
enable_system_updates: False

# Moonraker update/camera implementation mission (2026-07-27, see
# docs/NEBULAOS_MOONRAKER_UPDATE_AND_CAMERA_ANALYSIS.md): "klipper" and
# "moonraker" are Moonraker's own two RESERVED update_manager slots, not
# generic extensions - confirmed directly against vendor/moonraker's
# update_manager/common.py (get_base_configuration/BASE_CONFIG/
# OPTION_OVERRIDES). For these two reserved names, Moonraker hardcodes
# type/origin/managed_services/requirements internally and auto-discovers
# path/executable/virtualenv live (Klipper's from its own identify
# handshake over KlippyConnection; Moonraker's own from sys.exec_prefix/
# source_info) - the ONLY options a [update_manager klipper]/
# [update_manager moonraker] section can actually override are channel,
# pinned_commit, refresh_interval, and report_anomalies. Every other
# option previously listed here (type, path, origin, primary_branch,
# managed_services, virtualenv, requirements) was silently never read -
# each one surfaced as a permanent "Unparsed config option" warning on
# every single boot, on a byte-for-byte fresh install, not because of any
# crash, staleness, or version mismatch. This exact reduced shape (channel
# only) is what SimpleAF's own current, real, proven k1/moonraker.conf
# uses for these same two reserved sections - not a NebulaOS invention.
#
# For reference (accurate documentation, not something Moonraker reads
# for these reserved names): Klipper is the checkout at
# $NEBULAOS_ROOT/apps/klipper - since the Phase 1 no-fork migration that is
# OFFICIAL github.com/Klipper3d/klipper, master branch, with NebulaOS's own
# modules composed in from $NEBULAOS_ROOT/apps/nebulaos-klipper-extensions
# by symlink activation at boot. It is bind-mounted onto /opt/klipper by
# S05nebulaos-activate and seeded by S04nebulaos-factory-seed. Moonraker is
# the checkout at $NEBULAOS_ROOT/apps/moonraker (github.com/Arksine/
# moonraker, master branch), running from the venv at
# $NEBULAOS_ROOT/envs/moonraker. Both paths are what Klippy/Moonraker
# already report live via their own discovery mechanisms - not something
# this config controls.
#
# Worth knowing about the composition: the symlinks it places inside the
# Klipper checkout are listed in that clone's own .git/info/exclude, which
# lives inside .git/ and is never part of any working tree. Moonraker
# therefore sees a genuinely pristine official Klipper repo - not dirty, not
# diverged, no untracked source files, no anomalies.
#
# HISTORICAL (retired fork) - kept because it documents why the branch has
# to be "master" and why a synthetic seed commit was fatal, both of which
# still apply to the official checkout that replaced it:
#
# NebulaOS auto-updates-camera-complete mission (2026-07-28, see
# docs/NEBULAOS_MOONRAKER_UPDATE_AND_CAMERA_ANALYSIS.md): Klipper's
# production branch was "nebulaos" until this mission, which does not
# match the hardcoded "master" primary_branch default Moonraker's
# reserved klipper slot falls back to when the option is absent
# (git_deploy.py's `config.get("primary_branch", "master")` - never
# overridable for reserved slots, primary_branch isn't in
# OPTION_OVERRIDES). Combined with the factory seed's old synthetic
# wrapper commit (see S04nebulaos-factory-seed's own history), this made
# every freshly-seeded device's klipper/moonraker permanently
# diverged=true / is_valid=false, blocking every real update. Klipper's
# real, already-published "nebulaos" commit was pushed as a genuine
# "master" branch on the same coreflake1/NebulaOS-klipper fork; "nebulaos"
# remains as the development branch this project keeps building from.
# Phase 1 no-fork migration (2026-08-17): [update_manager klipper] and the
# new [update_manager nebulaos_klipper_extensions] section both moved into a
# NebulaOS-managed include, and this one line replaces them.
#
# The reason is a real, easily-missed constraint rather than tidiness. This
# file is USER OWNED (docs/NEBULAOS_PERSISTENT_LIFECYCLE.md) and is
# architecturally never written by seeding or migration - correct for a file
# users edit, but it also means a firmware image that qualifies a newer
# Klipper would have no way to move the pin on a device that already exists.
# One stable include line here, pointing at the IMAGE OWNED
# /etc/nebulaos/moonraker/klipper-pin.conf on the read-only rootfs, makes
# advancing a qualified pin an ordinary firmware update instead of a
# request that every user hand-edit their config - AND makes an A/B slot
# switch or rollback restore the matching pins automatically, simply
# because the rootfs changed, with no persistent-state sync step at all.
#
# Phase 1.5 persistent-namespace mission (2026-08): this used to be a
# relative glob, `[include nebulaos/*.conf]`, resolving into a
# NebulaOS-managed island inside the persistent printer_data/config/ tree
# that S04nebulaos-migrate kept in sync. That worked for one-directional
# firmware updates but not A/B rollback - both slots share the same
# persistent /usr/data, so a device rolled back to an older slot would
# still see the newer slot's persistent copy. An absolute path fixes that;
# Moonraker's confighelper.py resolves a leading "/" as an absolute path
# before falling back to glob-relative-to-including-file, so this is a
# real, intentional feature, not a workaround. See
# docs/NEBULAOS_PERSISTENT_NAMESPACE.md.
#
# KNOWN LIMITATION, stated rather than buried: a device provisioned before
# this exact line existed will not have it, because nothing may rewrite a
# user-owned file except the one bounded, idempotent migration documented
# in docs/NEBULAOS_PRINTER_CFG_MIGRATION.md, which does cover exactly this
# line (recognizing the old relative-glob form and rewriting only that one
# line). A device whose moonraker.conf predates even the old glob form
# keeps working exactly as before but ignores the managed pins until this
# line is added by hand. See docs/NEBULAOS_UPDATE_OWNERSHIP.md.
[include /etc/nebulaos/moonraker/klipper-pin.conf]

[update_manager moonraker]
channel: stable

[update_manager mainsail]
type: web
channel: stable
repo: mainsail-crew/mainsail
path: /usr/data/nebulaos/apps/mainsail

[authorization]
trusted_clients:
 127.0.0.1
 192.168.0.0/16
 10.0.0.0/8
cors_domains:
 http://*.local
 http://*.lan
