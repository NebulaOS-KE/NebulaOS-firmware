# NebulaOS memory policy (MEM-T11), applied by Buildroot's S02sysctl.
#
# swappiness 60 (kernel default): with zram as the primary swap tier, moving
# cold anonymous pages into compressed RAM is cheaper than evicting file
# pages that must be re-read from eMMC. Raised to 100 only if hardware
# measurement keeps klippy mlock (HWDP-MEM-6).
vm.swappiness = 60
# page-cluster 0: swap in one page at a time. The default readahead of 8
# pages models rotational-disk seeks and is wasted work for zram.
vm.page-cluster = 0
# MEM-T18: reclaim headroom. min 4 MiB (default ~2 MiB on ~240 MiB RAM), and a
# wider low/high gap (scale factor 100 = 1%): kswapd starts earlier, and
# atomic allocations (brcmfmac RX refills) keep a 4 MiB floor. Costs about
# 7 MiB of MemAvailable, paid for by the 32 MiB returned by MEM-T01. Rolled
# back with MEM-T01 if the hardware check (HWDP-MEM-1/9) fails.
vm.min_free_kbytes = 4096
vm.watermark_scale_factor = 100
