# NebulaOS freeze diagnosis (2026-11-08): every stall the kernel can see
# ends in a panic, and a panic writes the whole kernel log into pstore
# (the black box keeps it as FREEZE/CRASH evidence) past a console lock a
# stuck CPU may hold. The watchdog would reset the printer anyway; this
# only makes sure the reset leaves the reason behind.
#
# RCU stall (21 s): one CPU stopped responding while the other still runs.
kernel.panic_on_rcu_stall = 1
# Backtraces of every CPU, not only the detecting one.
kernel.softlockup_all_cpu_backtrace = 1
kernel.hardlockup_all_cpu_backtrace = 1
