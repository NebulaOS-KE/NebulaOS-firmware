# NebulaOS Ender-3 V3 KE webcam quality presets.
#
# IMMUTABLE, SLOT/IMAGE OWNED. Three one-click macros (LOW/MED/HIGH)
# that write S50webcam's quality marker and restart it. HIGH matches the
# factory default (1920x1080 @ 30fps). Klipper has no built-in webcam
# control, so this is genuine NebulaOS functionality.
#
# Derived from: OpenKE camera-quality.cfg (relocated script path from
# GuppyScreen/scripts/ to /usr/libexec/).

[gcode_shell_command set_camera_quality]
command: /usr/libexec/nebulaos-set-camera-quality
timeout: 30.0
verbose: True

[gcode_macro SET_CAMERA_QUALITY_LOW]
description: Webcam: 640x480, uncapped fps (smallest WiFi payload)
gcode:
  RUN_SHELL_COMMAND CMD=set_camera_quality PARAMS=LOW

[gcode_macro SET_CAMERA_QUALITY_MED]
description: Webcam: 1280x720, uncapped fps
gcode:
  RUN_SHELL_COMMAND CMD=set_camera_quality PARAMS=MED

[gcode_macro SET_CAMERA_QUALITY_HIGH]
description: Webcam: 1920x1080 @ 30fps (qualified default)
gcode:
  RUN_SHELL_COMMAND CMD=set_camera_quality PARAMS=HIGH

# Nebula Camera controls (Run 23, Tim 2026-10-29): the settings of the
# screen's Display > Camera page as macros; /usr/libexec/nebulaos-nebula-camera
# checks the value and calls nebulaos-osconfig camera.
[gcode_shell_command nebula_camera]
command: /usr/libexec/nebulaos-nebula-camera
timeout: 45.0
verbose: True

[gcode_macro NEBULA_CAMERA_NIGHT_MODE]
description: Nebula Camera night mode: MODE=AUTO (default), COLOR (always colour) or BW (always black-and-white)
gcode:
  RUN_SHELL_COMMAND CMD=nebula_camera PARAMS="night {params.MODE|default('auto')|lower}"

[gcode_macro NEBULA_CAMERA_ANTI_FLICKER]
description: Nebula Camera anti-flicker for room lights: HZ=50 (Europe), 60 (Americas) or OFF
gcode:
  RUN_SHELL_COMMAND CMD=nebula_camera PARAMS="flicker {params.HZ|default('50')|lower}"

[gcode_macro NEBULA_CAMERA_RESTART]
description: Restart the Nebula Camera; the picture is gone a few seconds, the settings come back (not while printing)
gcode:
  RUN_SHELL_COMMAND CMD=nebula_camera PARAMS=restart

[gcode_macro NEBULA_CAMERA_DEFAULTS]
description: Nebula Camera: every setting back to its default
gcode:
  RUN_SHELL_COMMAND CMD=nebula_camera PARAMS=defaults

# Timelapse (2026-10-31): upstream moonraker-timelapse's Klipper macros,
# unchanged - an image file next to this one (timelapse.cfg, from the pinned
# upstream repo; see manifests/dependencies.conf). Switched on and set up in
# Mainsail (Settings > Timelapse); off by default.
[include timelapse.cfg]

# The layer watcher: one picture per layer without a slicer change. START_PRINT
# starts it after the purge line, END_PRINT and CANCEL_PRINT stop it. Once a
# second it looks at the nozzle height; a new height that holds for a second
# is a new layer (a Z-hop does not hold). It only calls TIMELAPSE_TAKE_FRAME
# while timelapse is enabled; in hyperlapse mode upstream ignores the call.
# A slicer that also sends TIMELAPSE_TAKE_FRAME gets two pictures per layer -
# remove that line from the slicer.
[gcode_macro _NEBULAOS_TIMELAPSE]
description: Timelapse layer watcher (ACTION=START or STOP)
variable_active: False
variable_frame_z: -1.0
variable_seen_z: -1.0
gcode:
  {% if params.ACTION|default('STOP')|upper == 'START' %}
    SET_GCODE_VARIABLE MACRO=_NEBULAOS_TIMELAPSE VARIABLE=active VALUE=True
    SET_GCODE_VARIABLE MACRO=_NEBULAOS_TIMELAPSE VARIABLE=frame_z VALUE=-1.0
    SET_GCODE_VARIABLE MACRO=_NEBULAOS_TIMELAPSE VARIABLE=seen_z VALUE=-1.0
    UPDATE_DELAYED_GCODE ID=_NEBULAOS_TIMELAPSE_WATCH DURATION=1
  {% else %}
    SET_GCODE_VARIABLE MACRO=_NEBULAOS_TIMELAPSE VARIABLE=active VALUE=False
    UPDATE_DELAYED_GCODE ID=_NEBULAOS_TIMELAPSE_WATCH DURATION=0
  {% endif %}

[delayed_gcode _NEBULAOS_TIMELAPSE_WATCH]
gcode:
  {% set w = printer['gcode_macro _NEBULAOS_TIMELAPSE'] %}
  {% if w.active %}
    {% set z = printer.gcode_move.gcode_position.z|round(2) %}
    {% if printer['gcode_macro TIMELAPSE_TAKE_FRAME'].enable and printer.print_stats.state == 'printing' %}
      {% if z < w.frame_z %}
        # back below the last picture's height: that one was a long Z-hop
        SET_GCODE_VARIABLE MACRO=_NEBULAOS_TIMELAPSE VARIABLE=frame_z VALUE={z}
      {% elif z > w.frame_z + 0.04 and z == w.seen_z %}
        TIMELAPSE_TAKE_FRAME
        SET_GCODE_VARIABLE MACRO=_NEBULAOS_TIMELAPSE VARIABLE=frame_z VALUE={z}
      {% endif %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_NEBULAOS_TIMELAPSE VARIABLE=seen_z VALUE={z}
    UPDATE_DELAYED_GCODE ID=_NEBULAOS_TIMELAPSE_WATCH DURATION=1
  {% endif %}
