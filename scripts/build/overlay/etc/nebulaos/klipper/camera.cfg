# NebulaOS Ender-3 V3 KE webcam quality presets.
#
# IMMUTABLE, SLOT/IMAGE OWNED. Three one-click macros (LOW/MED/HIGH)
# that write S50webcam's quality marker and restart it. HIGH matches the
# factory default (1920x1080 @ 30fps). Klipper has no built-in webcam
# control, so this is genuine NebulaOS functionality.
#
# Derived from: OpenKE camera-quality.cfg (relocated script path from
# GuppyScreen/scripts/ to /usr/libexec/).

[gcode_shell_command set_camera_quality]
command: /usr/libexec/nebulaos-set-camera-quality
timeout: 30.0
verbose: True

[gcode_macro SET_CAMERA_QUALITY_LOW]
description: Webcam: 640x480, uncapped fps (smallest WiFi payload)
gcode:
  RUN_SHELL_COMMAND CMD=set_camera_quality PARAMS=LOW

[gcode_macro SET_CAMERA_QUALITY_MED]
description: Webcam: 1280x720, uncapped fps
gcode:
  RUN_SHELL_COMMAND CMD=set_camera_quality PARAMS=MED

[gcode_macro SET_CAMERA_QUALITY_HIGH]
description: Webcam: 1920x1080 @ 30fps (qualified default)
gcode:
  RUN_SHELL_COMMAND CMD=set_camera_quality PARAMS=HIGH

# Nebula Camera controls (Run 23, Tim 2026-10-29): the settings of the
# screen's Display > Camera page as macros; /usr/libexec/nebulaos-nebula-camera
# checks the value and calls nebulaos-osconfig camera.
[gcode_shell_command nebula_camera]
command: /usr/libexec/nebulaos-nebula-camera
timeout: 45.0
verbose: True

[gcode_macro NEBULA_CAMERA_NIGHT_MODE]
description: Nebula Camera night mode: MODE=AUTO (default), COLOR (always colour) or BW (always black-and-white)
gcode:
  RUN_SHELL_COMMAND CMD=nebula_camera PARAMS="night {params.MODE|default('auto')|lower}"

[gcode_macro NEBULA_CAMERA_ANTI_FLICKER]
description: Nebula Camera anti-flicker for room lights: HZ=50 (Europe), 60 (Americas) or OFF
gcode:
  RUN_SHELL_COMMAND CMD=nebula_camera PARAMS="flicker {params.HZ|default('50')|lower}"

[gcode_macro NEBULA_CAMERA_RESTART]
description: Restart the Nebula Camera; the picture is gone a few seconds, the settings come back (not while printing)
gcode:
  RUN_SHELL_COMMAND CMD=nebula_camera PARAMS=restart

[gcode_macro NEBULA_CAMERA_DEFAULTS]
description: Nebula Camera: every setting back to its default
gcode:
  RUN_SHELL_COMMAND CMD=nebula_camera PARAMS=defaults
