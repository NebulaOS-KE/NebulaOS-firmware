# NebulaOS - Ender-3 V3 KE physical machine definition.
#
# Phase 1.5 persistent-namespace mission (2026-08): split out of the
# monolithic printer.cfg that used to carry this content directly. This file
# is IMMUTABLE and SLOT/IMAGE OWNED - it ships on the read-only squashfs at
# /etc/nebulaos/klipper/machine.cfg and is never written by any runtime code.
# A/B slot switch or rollback restores the matching machine definition
# automatically, simply because the rootfs changed - see
# docs/NEBULAOS_PERSISTENT_LIFECYCLE.md and
# docs/NEBULAOS_PERSISTENT_NAMESPACE.md for the full ownership model.
#
# DO NOT EDIT THIS FILE ON A RUNNING DEVICE. Your changes will be gone the
# next time this slot is reflashed or updated. Everything here is generic
# per-model hardware definition, not per-unit calibration - per-unit
# calibration (SAVE_CONFIG) lives in the persistent, user-owned
# printer.cfg entrypoint that includes this file.
#
# Content moved here verbatim from the former monolithic printer.cfg -
# section text, values and ordering are unchanged from what was already
# qualified; only the file boundary is new. See that file's own former
# header (preserved in git history) for the full provenance of these
# values: real hardware, Creality's own factory defaults, and the
# key-by-key reconciliation against this project's extension-set code.
#
# Sections requiring nebulaos-provided types (nebulaos_temperature_mcu)
# depend on [nebulaos_compat] and [nebulaos_version] in platform.cfg having
# already loaded - printer.cfg includes platform.cfg before this file for
# exactly that reason. Do not include this file standalone.

[firmware_retraction]
retract_length: 0.6
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 30

[mcu]
serial: /dev/ttyS1
baud: 230400
restart_method: command

# Phase 1.9A host-MCU restoration: klipper_mcu (Klipper's own MACH_LINUX
# build target, S54nebulaos-host-mcu) serves this second, virtual MCU over
# a Unix socket - no interaction with the physical GD32F303 above, which
# S50nebulaos-mcu-guard/mcu_lifecycle.py own exclusively. [adxl345] is wired
# directly to the SoC (a real SPI bus), not to the GD32F303 - see
# _project/missions/phase1.9-host-mcu-accelerometer-plr-analysis.md section 1
# for the full relationship chain. Values below are the exact stock KE
# wiring (same physical board, only the OS/firmware differ), confirmed live
# against the real, unmounted, read-only stock rootfs partition, not
# invented. [adxl345]/[resonance_tester] intentionally use upstream Klipper's
# own implementation, not Creality's patched one - see that same document's
# section 4 for why zero core patches are required for this.
[mcu rpi]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: rpi:None
spi_speed: 2000000
spi_bus: spidev2.0
axes_map: z,y,x

# Resonance tester (Phase 2 §6, hardware-qualified envelope 80/50):
# accel_per_hz=50 keeps the step rate within this unit's host MCU budget
# at high frequencies (accel_per_hz=70 caused "Timer too close" shutdowns
# near 80Hz on the Ingenic X2000's weak dual-core MIPS SoC). max_freq=80
# covers the full useful response range — fitted values are well below
# (X=mzv@56.8Hz, Y=mzv@35.6Hz). These values govern direct
# SHAPER_CALIBRATE / TEST_RESONANCES calls; the guided workflow
# (NEBULAOS_INPUT_SHAPER_CALIBRATE) additionally uses the explicit
# shaper_freq_end/shaper_accel_per_hz in [nebulaos_calibration].
[resonance_tester]
accel_chip: adxl345
accel_per_hz: 50
probe_points: 117.5,117.5,100
max_freq: 80

# Phase 1.9B power-loss recovery: the physical BL24C16F EEPROM's production
# owner is now the Linux 6.6 in-tree at24/nvmem kernel driver (see
# accelerometer-eeprom-bus-enable-variant.sh's own eeprom@50 DT node and
# CONFIG_EEPROM_AT24=y - NOT [bl24c16f]/i2c_mcu:rpi/CONFIG_I2C_CHARDEV, which
# owned this same chip in Phase 1.9A and is deliberately NOT instantiated
# here any more; extras/bl24c16f.py itself stays vendored in
# NebulaOS-klipper-extensions for provenance only). eeprom_path below must
# match that DT node's resulting sysfs path exactly.
[nebulaos_power_loss_recovery]
eeprom_path: /sys/bus/i2c/devices/2-0050/eeprom
# G80 (Run 22, Tim 2026-10-28): the physical resume (bed + nozzle heat, X/Y
# home, Z declared at its recorded height and lifted, prime, continue) is ON
# by default; after a power loss the screen and Mainsail ask "Resume?". The
# extension's own default stays off. Still to do before a RELEASE: the
# supervised power-cut test on ke-dev (TEST.md).
physical_resume: True

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 8000
# ke-mainline-klipper stock-parity mission: max_accel_to_decel is
# deprecated upstream; 0.6875 = 1 - min(1, max_accel_to_decel/max_accel)
# is the exact equivalent per this build's own toolhead.py, so this is a
# zero-behavior-change migration.
minimum_cruise_ratio: 0.6875
max_z_velocity: 30
square_corner_velocity: 5.0
max_z_accel: 300

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA5
position_endstop: -12
position_min: -12
position_max: 221
homing_speed: 30
homing_retract_dist: 0

[tmc2208 stepper_x]
uart_pin: PB12
interpolate: True
run_current: 0.75
sense_resistor: 0.150
stealthchop_threshold: 0

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 60
endstop_pin: !PA6
position_endstop: -20
position_min: -20
position_max: 223
homing_speed: 30
homing_retract_dist: 0

[tmc2208 stepper_y]
uart_pin: PB13
interpolate: True
run_current: 0.75
sense_resistor: 0.150
stealthchop_threshold: 0

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 246
position_min: -5

[tmc2208 stepper_z]
uart_pin: PB14
interpolate: True
run_current: 0.8
stealthchop_threshold: 0
sense_resistor: 0.150

[bltouch]
sensor_pin: PC14
control_pin: PC13
x_offset: 0
y_offset: 27
# z_offset (Phase 2 calibration-framework mission): NOT defined here any
# more, deliberately - see docs/NEBULAOS_CALIBRATION_CONFIG_OWNERSHIP.md.
# Klipper's own configfile.py refuses SAVE_CONFIG for any option that has
# a literal value anywhere in the regular (non-autosave) config text, in
# ANY included file - so a value here, however "just a fresh-install
# default", would permanently block NEBULAOS_Z_OFFSET_CALIBRATE (or stock
# PROBE_CALIBRATE) from ever persisting a real calibration via SAVE_CONFIG.
# The persistent, user-owned printer.cfg seed now carries the equivalent
# factory-default value (0.000) as a pre-baked SAVE_CONFIG autosave block
# instead, which behaves identically at boot (bltouch.py still gets a
# real, required z_offset) but is a legitimate overwrite target for a real
# calibration later. z_offset is still a required option for bltouch.py -
# every composed config must supply it from exactly one place; this file
# is deliberately no longer that place.
probe_with_touch_mode: true
stow_on_each_sample: false
speed: 5
lift_speed: 20

# Mainboard fan (Run 21, Tim 2026-10-28): was a plain [output_pin] (as on
# stock) that started off at every Klipper start and that nothing switched
# on - the board ran uncooled unless someone toggled it. Now Klipper's own
# controller_fan: on while any stepper is enabled or the hotend/bed heater
# is on (the drivers and heater MOSFETs are what warm the board), off 5 min
# after the last of them. No switch; Mainsail and the screen show On/Off.
# A Klipper shutdown (error) leaves it ON (shutdown_speed).
[controller_fan MainBoardFan]
pin: !PB1
fan_speed: 1.0
shutdown_speed: 1.0
idle_timeout: 300
heater: extruder, heater_bed

[extruder]
# rotation_distance, control and pid_Kp/Ki/Kd (Phase 2 calibration-framework
# mission): NOT defined here any more - moved to the persistent printer.cfg
# seed's pre-baked SAVE_CONFIG autosave block, for the same
# _disallow_include_conflicts reason as [bltouch]'s z_offset above. This
# lets stock PID_CALIBRATE (exposed via calibration.cfg's PID_HOTEND /
# PID_BED upstream UI adapters) and NEBULAOS_ESTEPS_CALIBRATE persist a
# real result via ordinary
# SAVE_CONFIG. Safety bounds (min_temp/max_temp)
# and genuine static hardware description stay here, image-owned, exactly
# as before - only the mutable, per-unit-calibratable values moved. See
# docs/NEBULAOS_CALIBRATION_CONFIG_OWNERSHIP.md.
max_extrude_only_distance: 1000
max_extrude_cross_section: 80
pressure_advance: 0.036
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 320

[heater_bed]
# control and pid_kp/ki/kd (Phase 2 calibration-framework mission): NOT
# defined here any more - see [extruder]'s comment above and
# docs/NEBULAOS_CALIBRATION_CONFIG_OWNERSHIP.md. min_temp/max_temp (real
# safety bounds, enforced independently by Klipper's heater code) stay
# here, image-owned.
heater_pin: PB2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
min_temp: 0
max_temp: 120

[verify_heater extruder]
[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

# GD32 MCU die-temperature sensor. sensor_type: nebulaos_temperature_mcu is
# provided by the NebulaOS extension set (extras/nebulaos_temperature_mcu.py
# in NebulaOS-klipper-extensions), registered through Klipper's own
# heaters.add_sensor_factory() - not a core-file patch. Requires
# [nebulaos_compat] (platform.cfg) to have already force-loaded and
# verified the providing module.
[temperature_sensor mcu_temp]
sensor_type: nebulaos_temperature_mcu
min_temp: 0
max_temp: 100

# Part cooling fan (Phase 2 minimal config refactor, 2026-09-05): the KE's
# part cooling fan on PA0 is a standard PWM fan. Stock Creality firmware used
# [output_pin fan0] with SET_PIN (a patched-Klipper artifact); upstream
# Klipper's [fan] makes M106/M107 work natively — required for slicer part
# cooling, END_PRINT cooldown, and standard gcode compatibility.
[fan]
pin: PA0
cycle_time: 0.0100

[heater_fan nozzle_fan]
pin: PC1
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.0
heater: extruder
fan_speed: 1.0
heater_temp: 60.0

[bed_mesh]
speed: 350
mesh_min: 5,10
mesh_max: 215,215
probe_count: 9,9
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0
horizontal_move_z: 8

# Phase 2 calibration-framework mission: pristine upstream Klipper section
# (klippy/extras/axis_twist_compensation.py, 58bd67db... - NOT modified,
# NOT forked, NOT shadowed by any NebulaOS file of the same name). Only the
# six calibrate_* sample-geometry inputs are set here, by design: these are
# fixed-per-model geometry, the same category as [bed_mesh]'s own
# mesh_min/mesh_max/probe_count immediately above, not per-unit calibration
# results - so, exactly like [bed_mesh], setting them here creates no
# SAVE_CONFIG conflict (the six RESULT fields a real calibration writes -
# z_compensations, zy_compensations, compensation_start_x/end_x,
# compensation_start_y/end_y - are different option names, never given a
# literal value anywhere in this immutable tree, and stage cleanly into
# printer.cfg's own SAVE_CONFIG block exactly like [bed_mesh] profiles do).
#
# calibrate_start_x/end_x/y and calibrate_start_y/end_y/x: geometry for the
# axis-twist calibration sweep. X-axis values were software-derived only
# (see _project/missions/phase2-calibration-final-architecture-investigation.md
# section 9) and remain untouched - cross-checked against stepper_x's own
# position_max:221 with [bltouch] x_offset:0, giving probe-frame X=200 at
# calibrate_end_x=200, 21mm inside the physical limit.
#
# calibrate_end_y is corrected here from that same investigation's original
# software-derived candidate (200) to 190 - live hardware qualification
# (Phase 2 axis-twist qualification, 2026-08-31 - see
# _evidence/phase2-axis-twist-qualification-20260831-203913/) found 200
# genuinely unsafe: with [bltouch] y_offset:27, calibrate_end_y=200 puts the
# PROBE (not the nozzle) at Y=227 during the sweep - stepper_y's own
# position_max is 223, so that candidate exceeded real physical Y travel by
# 4mm. 190 gives probe-frame Y=217, a deliberate 6mm margin under the real
# limit, not just clearing it. This is the exact value the live qualification
# session set as a printer.cfg override at the time (predating this file's
# own correction) - now folded back into the canonical default so a fresh
# device gets the hardware-verified value directly, with no override needed.
[axis_twist_compensation]
calibrate_start_x: 20
calibrate_end_x: 200
calibrate_y: 117.5
calibrate_start_y: 40
calibrate_end_y: 190
calibrate_x: 117.5
horizontal_move_z: 5
speed: 50

[input_shaper]

[skew_correction]

# Required by print.cfg's adaptive bed mesh, _SMART_PARK, and _LINE_PURGE
# (all read printer.exclude_object.objects). Without this section that
# access raises a Jinja UndefinedError and START_PRINT fails. Moonraker's
# [file_manager] enable_object_processing (moonraker.conf) populates this
# with real per-object polygons from the sliced gcode.
[exclude_object]
