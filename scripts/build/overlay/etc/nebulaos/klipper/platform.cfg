# NebulaOS <-> Klipper platform integration.
#
# Phase 1.5 persistent-namespace mission (2026-08): split out of the
# monolithic printer.cfg. IMMUTABLE, SLOT/IMAGE OWNED - ships at
# /etc/nebulaos/klipper/platform.cfg.
#
# This is the persistent printer.cfg entrypoint's FIRST include, and
# [nebulaos_compat] below must be the first NebulaOS section to load, full
# stop - preserved unchanged from the former printer.cfg's own load-bearing
# ordering requirement (see git history for the full original comment this
# was carried over from). It checks that the installed Klipper is the
# commit the composed extension set was qualified against, that every
# module the manifest declares is really present, that every Klipper API
# the set depends on still exists, and that the platform published a
# passing verdict for the prebuilt c_helper.so. It fails CLOSED: this
# extension set drives a load-cell probe into a heated bed, and "did not
# start, and said exactly why" is strictly better than "started, but the
# probe is subtly wrong".
#
# It must load before machine.cfg's [temperature_sensor mcu_temp] (which
# needs the nebulaos_temperature_mcu sensor factory already registered) and
# before any other NebulaOS-provided config (beeper.cfg and camera.cfg use
# [gcode_shell_command] sections, which are NebulaOS-managed modules) —
# which is exactly why printer.cfg includes this file first.
[nebulaos_compat]

# Guppy integration: dynamically loaded on demand by GuppyScreen's TMC
# status panel via _GUPPY_LOAD_MODULE SECTION=tmcstatus, through the
# composed symlink path.
[tmcstatus]

# Runtime version truth (firmware tag/SHA, kernel/GuppyScreen pins, live
# Klipper commit + dirty state, persistent app generation), queryable via
# /printer/objects/query?nebulaos_version.
[nebulaos_version]

# klippy memory policy (NebulaOS-klipper-extensions extras/nebulaos_memory.py,
# MEM-T09): forked children (input-shaper calibration and other
# multiprocessing helpers) drop klippy's -900 OOM protection to 300 the moment
# they are forked.
[nebulaos_memory]
