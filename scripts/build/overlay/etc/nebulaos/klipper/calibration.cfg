# NebulaOS calibration coordinator configuration.
#
# IMMUTABLE, SLOT/IMAGE OWNED — ships at /etc/nebulaos/klipper/calibration.cfg
# on the read-only squashfs.
#
# [nebulaos_calibration] backs the Python extras (nebulaos_calibration.py,
# z_compensate.py) which register private _NEBULAOS_* commands. The public
# [gcode_macro NEBULAOS_*] wrappers below are the single canonical user-
# facing API — what users type, what Mainsail lists, what docs reference.
# {rawparams} passes all parameters through unchanged.
#
# reference_x/reference_y: the module has no default (None); this real,
# stock-precedented value (z_compensate.py noz_pos_center: 20,25) belongs
# in firmware config.
#
# shaper_freq_end/shaper_accel_per_hz: hardware-qualified Input Shaper
# envelope (Phase 2 §6, 80Hz/50mm/s^2/Hz). Passed as FREQ_END=/ACCEL_PER_HZ=
# to upstream SHAPER_CALIBRATE during NEBULAOS_INPUT_SHAPER_CALIBRATE.
# The lower accel_per_hz keeps the step rate within the Ingenic X2000's
# budget at high frequencies; 80Hz covers the full useful response range.

[nebulaos_calibration]
reference_x: 20
reference_y: 25
shaper_freq_end: 80
shaper_accel_per_hz: 50

# --- NebulaOS-owned calibration workflows ---
# These are genuine NebulaOS functionality — upstream Klipper does not
# provide these workflows. Python backends are _NEBULAOS_* (private).

[gcode_macro NEBULAOS_AUTO_CALIBRATE]
description: Guided geometry calibration (nozzle clean, Z-offset, bed mesh)
gcode:
    _NEBULAOS_AUTO_CALIBRATE {rawparams}

[gcode_macro NEBULAOS_CALIBRATION_CANCEL]
description: Cancel an in-progress calibration at the next stage boundary
gcode:
    _NEBULAOS_CALIBRATION_CANCEL {rawparams}

[gcode_macro NEBULAOS_Z_OFFSET_CALIBRATE]
description: Load-cell Z-offset calibration
gcode:
    _NEBULAOS_Z_OFFSET_CALIBRATE {rawparams}

[gcode_macro NEBULAOS_INPUT_SHAPER_CALIBRATE]
description: Guided input shaper calibration
gcode:
    _NEBULAOS_INPUT_SHAPER_CALIBRATE {rawparams}

[gcode_macro NEBULAOS_ESTEPS_CALIBRATE]
description: Guided extruder steps calibration
gcode:
    _NEBULAOS_ESTEPS_CALIBRATE {rawparams}

[gcode_macro NEBULAOS_LOAD_CELL_CALIBRATE]
description: Guided load cell calibration with a known weight (about 1 kg)
gcode:
    _NEBULAOS_LOAD_CELL_CALIBRATE {rawparams}

[gcode_macro NEBULAOS_NOZZLE_CLEAN]
description: Nozzle clean cycle
gcode:
    _NEBULAOS_NOZZLE_CLEAN {rawparams}

# --- Power Loss Recovery ---
# Public wrappers for the PLR Python backend (nebulaos_power_loss_recovery.py).
# The backend registers private commands; these are the Mainsail-facing API.

[gcode_macro NEBULAOS_RESUME_POWER_LOSS]
description: Resume printing from a power-loss checkpoint
gcode:
    NEBULAOS_PLR_RESUME {rawparams}

[gcode_macro NEBULAOS_CLEAR_POWER_LOSS_RECOVERY]
description: Discard a stale power-loss checkpoint without resuming
gcode:
    NEBULAOS_PLR_DISCARD {rawparams}

# --- Upstream UI adapters ---
# These are NOT NebulaOS functionality. They are trivial one-line adapters
# that make upstream Klipper operations available as clickable Mainsail
# buttons. They contain no algorithm, state, or orchestration.
#
# UPSTREAM_UI_ADAPTER: AXIS_TWIST_COMPENSATION_CALIBRATE (upstream)
# Mainsail cannot expose per-axis AXIS= parameter as separate buttons
# without a macro.
[gcode_macro AXIS_TWIST_X]
description: Calibrate X-axis twist compensation (upstream AXIS_TWIST_COMPENSATION_CALIBRATE)
gcode:
    AXIS_TWIST_COMPENSATION_CALIBRATE AXIS=X {rawparams}

[gcode_macro AXIS_TWIST_Y]
description: Calibrate Y-axis twist compensation (upstream AXIS_TWIST_COMPENSATION_CALIBRATE)
gcode:
    AXIS_TWIST_COMPENSATION_CALIBRATE AXIS=Y {rawparams}

# UPSTREAM_UI_ADAPTER: PID_CALIBRATE (upstream)
# Upstream PID_CALIBRATE requires explicit TARGET= with no default. These
# provide a one-click default target for the most common heaters.
[gcode_macro PID_BED]
description: PID-tune bed heater to 65C (upstream PID_CALIBRATE)
gcode:
    {% set target = params.TARGET|default(65)|int %}
    PID_CALIBRATE HEATER=heater_bed TARGET={target}

[gcode_macro PID_HOTEND]
description: PID-tune hotend to 230C (upstream PID_CALIBRATE)
gcode:
    {% set target = params.TARGET|default(230)|int %}
    PID_CALIBRATE HEATER=extruder TARGET={target}
