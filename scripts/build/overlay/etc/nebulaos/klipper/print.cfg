# NebulaOS print workflow — START_PRINT, END_PRINT, pause/resume, adaptive
# purge, and supporting helpers for the Creality Ender-3 V3 KE (BLTouch).
#
# Derived from pellcorp/creality "SimpleAF" @ d18d354456a8 (2026-07-29):
#   config/start_end.cfg, config/client.cfg, config/Line_Purge.cfg,
#   config/Smart_Park.cfg
# client.cfg carries its own upstream attribution:
#   "originally from https://github.com/fluidd-core/fluidd-config.git,
#    Copyright (C) 2022 Alex Zellner <alexander.zellner@googlemail.com>"
# Line_Purge.cfg and Smart_Park.cfg are derived from kyleisah/KAMP:
#   https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging
#
# Extraction removes SimpleAF's _SAF_* extensibility hooks and all
# touch/contact/eddy-ng/beacon/cartographer probe branches (the KE uses
# BLTouch only).  Fan control inlined as M106/M107 + auxiliary fan commands
# (TURN_OFF_FANS was SimpleAF-only).
#
# Requires: [exclude_object], [bed_mesh], [fan], [extruder], [heater_bed].


# =============================================================================
#  Infrastructure
# =============================================================================

[virtual_sdcard]
path: /opt/printer_data/gcodes
on_error_gcode: _ON_GCODE_FAILURE

[pause_resume]

[display_status]

[respond]
default_type: echo
default_prefix:

[idle_timeout]
timeout: 3600
gcode:
  {% if printer.pause_resume.is_paused %}
    RESPOND TYPE=command MSG='Printer is paused, timeout bypassed'
  {% else %}
    RESPOND TYPE=command MSG='Timeout Reached - Turning off heaters and motors'

    TURN_OFF_HEATERS

    {% if 'bed_mesh' in printer.configfile.settings %}
      BED_MESH_CLEAR
    {% endif %}
    M84
  {% endif %}

[virtual_pins]

[output_pin Bed_Warp_Stabilisation]
pin: virtual_pin:BED_WARP_STABILISE_pin
value: 1


# =============================================================================
#  Parameters
# =============================================================================

[gcode_macro _START_END_PARAMS]
# bed warp stabilisation: multiplier * target temp = wait seconds
variable_bed_warp_wait_multiplier: 8.0
# how far below target temp can the bed be to do fractional wait times
variable_bed_warp_fraction_wait: 0.75
# how long to wait each loop before displaying a status message
variable_bed_warp_wait_interval: 15
# max velocity for start print and bed mesh calibrate
variable_start_max_velocity: 400
# max accel for start print and bed mesh calibrate
variable_start_max_accel: 10000
# max square corner velocity for bed mesh calibrate
variable_start_square_corner_velocity: 5.0
# what to heat nozzle to just before oozing
variable_start_preheat_nozzle_temp: 150
# whether to do cooldown routine in END_PRINT
variable_end_print_cool_down: False
variable_end_print_cool_down_nozzle_temp: 70.0
# if target bed temp is above this the cool down is skipped
variable_end_print_cool_down_max_bed_temp: 70.0
# if bed warp stabilisation is enabled should we keep the bed heated
variable_end_print_keep_bed_heated: False
# position to move the nozzle to while heating the bed (including heat soaking)
# set this to 0 to disable this behaviour
variable_start_print_bed_heating_move_bed_distance: 50.0
# if the print bounding box is more than 75% full then switch to full bed mesh
# set to 0 to disable this to always use adaptive bed meshes
variable_full_bed_mesh_above_percentage_full: 75.0
gcode:

[gcode_macro _CLIENT_VARIABLE]
# the value in mm to lift the nozzle when move to park position
variable_custom_park_dz: 45.0
# park position during CANCEL_PRINT and END_PRINT
variable_park_at_cancel_x: 0.0
# park position during CANCEL_PRINT and END_PRINT
variable_park_at_cancel_y: 0.0
# the value to retract during CANCEL_PRINT or END_PRINT
variable_cancel_retract: 7.0
# park position during PAUSE / M600 / FILAMENT RUNOUT
variable_custom_park_x: 0.0
# park position during PAUSE / M600 / FILAMENT RUNOUT
variable_custom_park_y: 0.0
# the value to retract during PAUSE / M600 / FILAMENT RUNOUT
variable_retract: 1.0
# retract speed in mm/s
variable_speed_retract: 35.0
# the value to unretract while RESUME
variable_unretract: 1.0
# unretract speed in mm/s
variable_speed_unretract: 35.0
# z move speed in mm/s
variable_speed_hop: 15.0
# move speed in mm/s
variable_speed_move: 100.0
# if this variable is not empty filament must be loaded to start or resume a print
variable_runout_sensor: "filament_switch_sensor filament_sensor"
gcode:

[gcode_macro _KAMP_Settings]
description: This macro contains all adjustable settings for Line Purge and Smart Park
# Z position of nozzle during purge
variable_purge_height: 0.5
# Distance between tip of filament and nozzle before purge, should be at least the same as variable_cancel_retract
variable_tip_distance: 7.0
# Distance the purge will be in front of the print area, default is 10.
variable_purge_margin: 15
# Amount of filament to be purged prior to printing.
variable_purge_amount: 48
# Flow rate of purge in mm3/s. Default is 12.
variable_flow_rate: 12
# Z position for Smart Park, default is 10.
variable_smart_park_height: 10
# Z hop for end of Line Purge before printing, default is 10.
variable_line_purge_z_hop: 10
# how much to retract after doing line purge
variable_line_purge_retract: 0.5
variable_line_purge_retract_speed: 35.0
gcode:


# =============================================================================
#  Core Print Workflow
# =============================================================================

[gcode_macro START_PRINT]
variable_max_velocity: 0
variable_max_accel: 0
variable_square_corner_velocity: 0
gcode:
  # cancel any outstanding end-print cooldown
  UPDATE_DELAYED_GCODE ID=wait_for_end_print_cooldown DURATION=0

  # if a cooldown session was still in progress we want to forcefully end it
  {% set started_cooldown = printer["gcode_macro END_PRINT"].started_cooldown|default(false) %}
  {% if started_cooldown %}
    SET_GCODE_VARIABLE MACRO=END_PRINT VARIABLE=started_cooldown VALUE=False
    {% if "xyz" in printer.toolhead.homed_axes %}
      M84
    {% endif %}
    M107
    {% if 'fan_generic auxiliary' in printer.configfile.settings %}
      SET_FAN_SPEED FAN=auxiliary SPEED=0
    {% endif %}
  {% endif %}

  {% set runout_sensor = printer["gcode_macro _CLIENT_VARIABLE"].runout_sensor|default("") %}
  {% if runout_sensor != "" and printer[runout_sensor] != null %}
    {% set runout_sensor_id = (runout_sensor.split(" "))[1] %}
    SET_FILAMENT_SENSOR SENSOR={runout_sensor_id} ENABLE=1
    {% set filament_detected = printer[runout_sensor].filament_detected %}
  {% else %}
    {% set filament_detected = true %}
  {% endif %}

  {% if not filament_detected %}
    RESPOND TYPE=error MSG='Filament not detected, Print aborted! "{runout_sensor_id}" detects no filament, please load filament.'
    RESPOND TYPE=command MSG="action:prompt_begin Print aborted !!!"
    RESPOND TYPE=command MSG='action:prompt_text "{runout_sensor_id}" detects no filament, please load filament.'
    RESPOND TYPE=command MSG="action:prompt_footer_button Ok|RESPOND TYPE=command MSG=action:prompt_end|info"
    RESPOND TYPE=command MSG="action:prompt_show"
    CANCEL_PRINT
  {% else %}
    # record initial bed temp for warp stabilisation calculation
    {% set current_bed_temp = printer.heater_bed.temperature %}

    {% set BED_TEMP=params.BED_TEMP|default(65)|float %}
    {% set EXTRUDER_TEMP=params.EXTRUDER_TEMP|default(230)|float %}

    {% set max_velocity = printer.toolhead.max_velocity %}
    {% set max_accel = printer.toolhead.max_accel %}
    {% set square_corner_velocity = printer.toolhead.square_corner_velocity %}
    {% set start_max_velocity = [printer["gcode_macro _START_END_PARAMS"].start_max_velocity, max_velocity]|min %}
    {% set start_max_accel = [printer["gcode_macro _START_END_PARAMS"].start_max_accel, max_accel]|min %}
    {% set start_square_corner_velocity = [printer["gcode_macro _START_END_PARAMS"].start_square_corner_velocity, square_corner_velocity]|min %}
    {% set preheat_nozzle_temp = printer["gcode_macro _START_END_PARAMS"].start_preheat_nozzle_temp %}

    # save the current limits so we can restore them in END and CANCEL print
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=max_velocity VALUE={max_velocity}
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=max_accel VALUE={max_accel}
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=square_corner_velocity VALUE={square_corner_velocity}

    M104 S{preheat_nozzle_temp}  # start heating nozzle but only to just before oozing
    M140 S{BED_TEMP}  # start heating bed dont wait

    {% if max_velocity > start_max_velocity or max_accel > start_max_accel or square_corner_velocity > start_square_corner_velocity %}
      RESPOND TYPE=command MSG='Setting VELOCITY={start_max_velocity} (was {max_velocity}) ACCEL={start_max_accel} (was {max_accel}) SQUARE_CORNER_VELOCITY={start_square_corner_velocity} (was {square_corner_velocity})'
      SET_VELOCITY_LIMIT VELOCITY={start_max_velocity} ACCEL={start_max_accel} SQUARE_CORNER_VELOCITY={start_square_corner_velocity}
    {% endif %}

    # if we ran M84 because of cooldown we can't rely on printer.toolhead.homed_axes
    # (klipper does not update that object for M84 when executing during start print)
    {% if started_cooldown or "xyz" not in printer.toolhead.homed_axes %}
      G28
    {% endif %}

    {% set start_print_bed_heating_move_bed_distance = printer["gcode_macro _START_END_PARAMS"].start_print_bed_heating_move_bed_distance %}
    {% if start_print_bed_heating_move_bed_distance > 0 %}
      G0 Z{start_print_bed_heating_move_bed_distance} F1200
    {% endif %}

    M190 S{BED_TEMP}  # wait for bed temperature before next step

    _WARP_STABILISE TARGET_TEMP={BED_TEMP} CURRENT_TEMP={current_bed_temp}

    {% if 'bed_mesh' in printer.configfile.settings %}
      BED_MESH_CLEAR
    {% endif %}

    _START_PRINT_BED_MESH {rawparams}

    _SMART_PARK  # park the printhead near the print area

    M109 S{EXTRUDER_TEMP}  # wait for nozzle temperature before next step

    _LINE_PURGE

    {% if max_velocity > start_max_velocity or max_accel > start_max_accel or square_corner_velocity > start_square_corner_velocity %}
      RESPOND TYPE=command MSG='Restoring VELOCITY={max_velocity} ACCEL={max_accel} SQUARE_CORNER_VELOCITY={square_corner_velocity}'
      SET_VELOCITY_LIMIT VELOCITY={max_velocity} ACCEL={max_accel} SQUARE_CORNER_VELOCITY={square_corner_velocity}
    {% endif %}
  {% endif %}


# C3 (Z-offset chain review, 2026-10-22): the print's mesh is a throwaway.
# It is calibrated under its own name "adaptive" and never saved, so an
# unrelated SAVE_CONFIG later (load cell, PID, shaper...) can never replace
# the calibrated "default" mesh with the last print's mesh. Pinned Klipper's
# bed_mesh (58bd67db3) names it like this:
#   - the adaptive path applies (objects defined, ADAPTIVE=1): the name is
#     dropped (set_adaptive_mesh -> _profile_name None) and the mesh becomes
#     "adaptive-<hex>" - not staged for saving;
#   - ADAPTIVE=0 (bed usage above full_bed_mesh_above_percentage_full), no
#     objects, or no [exclude_object]: a full mesh under PROFILE - before
#     this fix "default" - and probe_finalize stages it (save_profile ->
#     configfile.set [bed_mesh <name>]) for the next SAVE_CONFIG.
# So PROFILE=adaptive here, then _START_PRINT_BED_MESH_UNSTAGE drops a staged
# [bed_mesh adaptive]. BED_MESH_PROFILE REMOVE only deletes the profile from
# storage (configfile.remove_section + the profiles list); it never calls
# set_mesh, so the mesh the print uses stays loaded (bed_mesh.profile_name
# stays "adaptive"). A [bed_mesh adaptive] saved by hand is removed at the
# next SAVE_CONFIG too: the name is reserved for the print mesh.
# F2 (Run 18): REMOVE of a section staged in this session still leaves
# save_config_pending set (pinned configfile records the removal as a
# pending deletion), so Mainsail would offer a SAVE_CONFIG that changes
# nothing. A full mesh is therefore taken through the adaptive path whenever
# the print defines objects: ADAPTIVE=1 with a margin larger than the bed
# clamps the adapted bounds to exactly mesh_min/mesh_max and keeps
# probe_count (ratio 1.0), i.e. the same points as ADAPTIVE=0, but the name
# is dropped and nothing is staged. Only a print WITHOUT exclude_object
# objects still goes through the named fallback + UNSTAGE above; that
# residual stays cosmetic: saving then writes nothing from the print
# (SAVE_CONFIG writes the autosave config, which no longer holds the
# section). Klipper is pristine upstream, so the pending flag itself is not
# patched.
[gcode_macro _START_PRINT_BED_MESH]
gcode:
  {% if 'bed_mesh' in printer.configfile.settings %}
    {% set BED_MESH_PROFILE=params.BED_MESH_PROFILE|default(None) %}
    {% if BED_MESH_PROFILE %}
      BED_MESH_PROFILE LOAD="{BED_MESH_PROFILE}"
    {% else %}
      {% set BED_MESH_ADAPTIVE=params.BED_MESH_ADAPTIVE|default(1) %}
      {% set full_bed_mesh_above_percentage_full = printer["gcode_macro _START_END_PARAMS"].full_bed_mesh_above_percentage_full %}
      {% if BED_MESH_ADAPTIVE == 1 and full_bed_mesh_above_percentage_full > 0 %}
        {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
        {% if all_points|length > 0 %}
          {% set print_x_min = all_points | map(attribute=0) | min | float %}
          {% set print_x_max = all_points | map(attribute=0) | max | float %}
          {% set print_y_min = all_points | map(attribute=1) | min | float %}
          {% set print_y_max = all_points | map(attribute=1) | max | float %}

          {% set print_width = print_x_max - print_x_min %}
          {% set print_depth = print_y_max - print_y_min %}
          {% set print_area = print_width * print_depth %}

          # for simplicity sake ignoring position_min and assuming position_max is the bed area
          {% set bed_width = printer.configfile.config.stepper_x.position_max | float %}
          {% set bed_depth = printer.configfile.config.stepper_y.position_max | float %}
          {% set bed_area = bed_width * bed_depth %}

          {% set bed_usage = (print_area / bed_area) * 100 %}
          {% if bed_usage >= full_bed_mesh_above_percentage_full %}
            RESPOND TYPE=command MSG="Using full bed mesh (Usage is {bed_usage|round(1)}%)"
            {% set BED_MESH_ADAPTIVE=0 %}
          {% endif %}
        {% endif %}
      {% endif %}
      {% set mesh_objects = printer.exclude_object.objects if 'exclude_object' in printer else [] %}
      {% if BED_MESH_ADAPTIVE|int == 0 and mesh_objects|length > 0 %}
        BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=1000 PROFILE=adaptive START_PRINT=1
      {% else %}
        BED_MESH_CALIBRATE ADAPTIVE={BED_MESH_ADAPTIVE} PROFILE=adaptive START_PRINT=1
      {% endif %}
      _START_PRINT_BED_MESH_UNSTAGE
    {% endif %}
  {% endif %}


# Rendered when it runs, i.e. after BED_MESH_CALIBRATE above: sees whether
# the full-mesh fallback staged the name "adaptive" (C3).
[gcode_macro _START_PRINT_BED_MESH_UNSTAGE]
gcode:
  {% if 'adaptive' in printer.bed_mesh.profiles %}
    BED_MESH_PROFILE REMOVE=adaptive
  {% endif %}


[gcode_macro END_PRINT]
variable_started_cooldown: False
gcode:
  {% set bed_warp_stabilisation = printer['output_pin Bed_Warp_Stabilisation'].value == 1 %}
  {% set end_print_cool_down = printer["gcode_macro _START_END_PARAMS"].end_print_cool_down %}
  {% set end_print_cool_down_nozzle_temp = printer["gcode_macro _START_END_PARAMS"].end_print_cool_down_nozzle_temp|float %}
  {% set end_print_cool_down_max_bed_temp = printer["gcode_macro _START_END_PARAMS"].end_print_cool_down_max_bed_temp|float %}
  {% set end_print_keep_bed_heated = printer["gcode_macro _START_END_PARAMS"].end_print_keep_bed_heated %}
  {% set runout_sensor = printer["gcode_macro _CLIENT_VARIABLE"].runout_sensor|default("") %}

  # reset this flag just to make sure
  SET_GCODE_VARIABLE MACRO=END_PRINT VARIABLE=started_cooldown VALUE=False

  _RESTORE_VELOCITY_ACCEL

  {% if 'bed_mesh' in printer.configfile.settings %}
    BED_MESH_CLEAR
  {% endif %}

  {% set current_bed_temp = printer.heater_bed.temperature %}

  {% if runout_sensor != "" %}
    {% set runout_sensor_id = (runout_sensor.split(" "))[1] %}
    SET_FILAMENT_SENSOR SENSOR={runout_sensor_id} ENABLE=0
  {% endif %}

  {% set cancel_retract = printer['gcode_macro _CLIENT_VARIABLE'].cancel_retract %}
  _CLIENT_RETRACT LENGTH={cancel_retract}

  # park in front of aux fan if cooldown
  {% if end_print_cool_down and current_bed_temp < end_print_cool_down_max_bed_temp %}
    _TOOLHEAD_PARK_CANCEL_END_PRINT COOLDOWN=1
  {% else %}
    _TOOLHEAD_PARK_CANCEL_END_PRINT
  {% endif %}

  {% if bed_warp_stabilisation and end_print_keep_bed_heated %}
    RESPOND TYPE=command MSG='Heat bed waiting for next print'
    M104 S0  # turning off the nozzle
  {% else %}
    TURN_OFF_HEATERS
  {% endif %}

  {% if end_print_cool_down and current_bed_temp < end_print_cool_down_max_bed_temp %}
    RESPOND TYPE=command MSG='Waiting for nozzle temp to be below {end_print_cool_down_nozzle_temp}c'

    {% if 'fan_generic auxiliary' in printer.configfile.settings %}
      SET_FAN_SPEED FAN=auxiliary SPEED=0.5
    {% endif %}

    M106 S180

    # flag that we have started the cooldown procedure
    SET_GCODE_VARIABLE MACRO=END_PRINT VARIABLE=started_cooldown VALUE=True
    UPDATE_DELAYED_GCODE ID=wait_for_end_print_cooldown DURATION=1
  {% else %}
    M84
    M107
    {% if 'fan_generic auxiliary' in printer.configfile.settings %}
      SET_FAN_SPEED FAN=auxiliary SPEED=0
    {% endif %}
  {% endif %}


[delayed_gcode wait_for_end_print_cooldown]
gcode:
  {% set end_print_cool_down_nozzle_temp = printer["gcode_macro _START_END_PARAMS"].end_print_cool_down_nozzle_temp|float %}
  {% if printer.extruder.temperature <= end_print_cool_down_nozzle_temp %}
    _WAIT_TEMP_COOL_DOWN_END
  {% else %}
    UPDATE_DELAYED_GCODE ID=wait_for_end_print_cooldown DURATION=5
  {% endif %}


# defined separately to exit the delayed gcode directly
[gcode_macro _WAIT_TEMP_COOL_DOWN_END]
gcode:
  UPDATE_DELAYED_GCODE ID=wait_for_end_print_cooldown DURATION=0

  # we already lowered the bed earlier so want to skip it now
  _TOOLHEAD_PARK_CANCEL_END_PRINT SKIP_Z_PARK=1

  M84
  M107
  {% if 'fan_generic auxiliary' in printer.configfile.settings %}
    SET_FAN_SPEED FAN=auxiliary SPEED=0
  {% endif %}

  SET_GCODE_VARIABLE MACRO=END_PRINT VARIABLE=started_cooldown VALUE=False


[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  # if there is an outstanding end print going on, we need to cancel it
  UPDATE_DELAYED_GCODE ID=wait_for_end_print_cooldown DURATION=0

  # restore idle_timeout time if needed
  {% if printer['gcode_macro RESUME'].restore_idle_timeout > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={printer['gcode_macro RESUME'].restore_idle_timeout}
  {% endif %}

  {% if not printer.pause_resume.is_paused %}
    _TOOLHEAD_PARK_CANCEL_END_PRINT
  {% endif %}

  {% set cancel_retract = printer['gcode_macro _CLIENT_VARIABLE'].cancel_retract %}
  _CLIENT_RETRACT LENGTH={cancel_retract}
  _RESTORE_VELOCITY_ACCEL
  M107
  {% if 'fan_generic auxiliary' in printer.configfile.settings %}
    SET_FAN_SPEED FAN=auxiliary SPEED=0
  {% endif %}

  TURN_OFF_HEATERS
  M84

  {% if 'bed_mesh' in printer.configfile.settings %}
    BED_MESH_CLEAR
  {% endif %}

  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False

  CANCEL_PRINT_BASE


# =============================================================================
#  Pause / Resume
# =============================================================================

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
  {% set idle_timeout = client.idle_timeout | default(0) %}
  {% set temp = printer[printer.toolhead.extruder].target if printer.toolhead.extruder != '' else 0 %}
  {% set restore = False if printer.toolhead.extruder == ''
              else True  if params.RESTORE | default(1) | int == 1 else False %}
  ##### end of definitions #####

  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE="{{'restore': restore, 'temp': temp}}"

  # set a new idle_timeout value
  {% if idle_timeout > 0 %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_idle_timeout VALUE={printer.configfile.settings.idle_timeout.timeout}
    SET_IDLE_TIMEOUT TIMEOUT={idle_timeout}
  {% endif %}
  PAUSE_BASE
  # G92: remember the saved Z adjustment for RESUME (C4).
  NEBULAOS_Z_ADJUST MARK=1

  _TOOLHEAD_PARK_PAUSE {rawparams}


[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
variable_last_extruder_temp: {'restore': False, 'temp': 0}
variable_restore_idle_timeout: 0
variable_idle_state: False
gcode:
  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
  {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
  {% set sp_move = client.speed_move | default(velocity) %}
  {% set runout_resume = True if client.runout_sensor | default("") == ""   # no runout
                    else True if printer[client.runout_sensor] == null      # no filament sensor
                    else True if not printer[client.runout_sensor].enabled  # sensor is disabled
                    else printer[client.runout_sensor].filament_detected %} # sensor status
  {% set can_extrude = True if printer.toolhead.extruder == ''           # no extruder defined in config
                  else printer[printer.toolhead.extruder].can_extrude %} # status of active extruder
  {% set do_resume = False %}
  {% set prompt_txt = [] %}
  ##### end of definitions #####

  #### Printer coming from timeout idle state ####
  {% if printer.idle_timeout.state | upper == "IDLE" or idle_state %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
    {% if last_extruder_temp.restore %}
      RESPOND TYPE=echo MSG='{"Restoring \"%s\" temperature to %3.1f°C, this may take some time" % (printer.toolhead.extruder, last_extruder_temp.temp) }'
      M109 S{last_extruder_temp.temp}
      {% set do_resume = True %}
    {% elif can_extrude %}
      {% set do_resume = True %}
    {% else %}
      RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder}'
      {% set _d = prompt_txt.append("\"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder) %}
    {% endif %}
  #### Printer coming out of regular PAUSE state ####
  {% elif can_extrude %}
    {% set do_resume = True %}
  {% else %}
    RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder}'
    {% set _d = prompt_txt.append("\"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder) %}
  {% endif %}
  {% if runout_resume %}
    {% if do_resume %}
      {% if restore_idle_timeout > 0 %} SET_IDLE_TIMEOUT TIMEOUT={restore_idle_timeout} {% endif %} # restore idle_timeout time

      _CLIENT_EXTRUDE
      RESUME_BASE VELOCITY={params.VELOCITY | default(sp_move)}
      # C4 / G92: upstream RESUME restored the gcode state saved at PAUSE,
      # undoing a screen Z adjustment made while paused - add back only what
      # the screen changed during the pause (offsets from Mainsail or the
      # print file stay as restored).
      NEBULAOS_Z_ADJUST RESUME=1
    {% endif %}
  {% else %}
    RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" detects no filament, please load filament and press RESUME" % (client.runout_sensor.split(" "))[1]}'
    {% set _d = prompt_txt.append("\"%s\" detects no filament, please load filament and press RESUME" % (client.runout_sensor.split(" "))[1]) %}
  {% endif %}

  ##### Generate User Information box in case of abort #####
  {% if not (runout_resume and do_resume) %}
    RESPOND TYPE=command MSG="action:prompt_begin RESUME aborted !!!"
    {% for element in prompt_txt %}
      RESPOND TYPE=command MSG='{"action:prompt_text %s" % element}'
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Ok|RESPOND TYPE=command MSG=action:prompt_end|info"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}


# =============================================================================
#  Internal Helpers
# =============================================================================

# Error handler for virtual_sdcard on_error_gcode and general gcode failures.
# With touch/contact probes removed, this always follows the non-touch path:
# restore state, turn off heaters/motors, clear mesh, and cancel.
[gcode_macro _ON_GCODE_FAILURE]
gcode:
  # restore idle_timeout time if needed
  {% if printer['gcode_macro RESUME'].restore_idle_timeout > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={printer['gcode_macro RESUME'].restore_idle_timeout}
  {% endif %}

  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False

  _RESTORE_VELOCITY_ACCEL
  M107
  {% if 'fan_generic auxiliary' in printer.configfile.settings %}
    SET_FAN_SPEED FAN=auxiliary SPEED=0
  {% endif %}

  TURN_OFF_HEATERS
  M84

  {% if 'bed_mesh' in printer.configfile.settings %}
    BED_MESH_CLEAR
  {% endif %}

  CANCEL_PRINT_BASE


[gcode_macro _TOOLHEAD_PARK_PAUSE]
description: Helper: park toolhead used in PAUSE
gcode:
  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
  {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
  {% set use_custom     = True %}
  {% set custom_park_x  = client.custom_park_x | default(0.0) %}
  {% set custom_park_y  = client.custom_park_y | default(0.0) %}
  {% set park_dz        = client.custom_park_dz | default(2.0) | abs %}
  {% set sp_hop         = client.speed_hop | default(15) * 60 %}
  {% set sp_move        = client.speed_move | default(velocity) * 60 %}
  ##### get config and toolhead values #####
  {% set origin    = printer.gcode_move.homing_origin %}
  {% set act       = printer.gcode_move.gcode_position %}
  {% set max       = printer.toolhead.axis_maximum %}
  {% set cone      = printer.toolhead.cone_start_z | default(max.z) %} ; height as long the toolhead can reach max and min of an delta
  {% set round_bed = True if printer.configfile.settings.printer.kinematics is in ['delta','polar','rotary_delta','winch']
                else False %}
  ##### define park position #####
  {% set z_min = params.Z_MIN | default(0) | float %}
  {% set z_park = [[(act.z + park_dz), z_min]|max, (max.z - origin.z)] | min %}
  {% set x_park = params.X       if params.X is defined
             else custom_park_x  if use_custom
             else 0.0            if round_bed
             else (max.x - 5.0) %}
  {% set y_park = params.Y       if params.Y is defined
             else custom_park_y  if use_custom
             else (max.y - 5.0)  if round_bed and z_park < cone
             else 0.0            if round_bed
             else (max.y - 5.0) %}
  ##### end of definitions #####
  _CLIENT_RETRACT
  {% if "xyz" in printer.toolhead.homed_axes %}
    G90
    G1 Z{z_park} F{sp_hop}
    G1 X{x_park} Y{y_park} F{sp_move}
    {% if not printer.gcode_move.absolute_coordinates %} G91 {% endif %}
  {% else %}
    RESPOND TYPE=echo MSG='Printer not homed'
  {% endif %}


[gcode_macro _TOOLHEAD_PARK_CANCEL_END_PRINT]
gcode:
  {% set cooldown = params.COOLDOWN | default(None) %}
  {% set skip_z_park = params.SKIP_Z_PARK | default(None) %}

  {% if "xyz" in printer.toolhead.homed_axes %}
    {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
    {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
    {% set sp_move = client.speed_move | default(velocity) * 60 %}
    {% set park_at_cancel_x = client.park_at_cancel_x %}

    G90
    {% if not skip_z_park %}
      {% set sp_hop = client.speed_hop | default(15) * 60 %}
      {% set park_dz = client.custom_park_dz | default(2.0) | abs %}
      {% set origin = printer.gcode_move.homing_origin %}
      {% set act = printer.gcode_move.gcode_position %}
      {% set max = printer.toolhead.axis_maximum %}
      {% set z_park = [[(act.z + park_dz), 0]|max, (max.z - origin.z)] | min %}

      G1 Z{z_park} F{sp_hop}
    {% endif %}
    {% if cooldown %}
      {% set park_at_cancel_y = printer.configfile.settings['stepper_y'].position_max / 2 %}
    {% else %}
      {% set park_at_cancel_y = client.park_at_cancel_y %}
    {% endif %}
    G0 X{park_at_cancel_x} Y{park_at_cancel_y} F{sp_move}
    # set back to relative coordinates
    {% if not printer.gcode_move.absolute_coordinates %}
      G91
    {% endif %}
  {% else %}
    RESPOND TYPE=error MSG='Printer not homed'
  {% endif %}


[gcode_macro _CLIENT_EXTRUDE]
description: Extrudes, if the extruder is hot enough
gcode:
  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
  {% set use_fw_retract = (client.use_fw_retract | default(false) | lower == 'true') and (printer.firmware_retraction is defined) %}
  {% set length = params.LENGTH | default(client.unretract) | default(1.0) | float %}
  {% set speed = params.SPEED | default(client.speed_unretract) | default(35) %}
  {% set absolute_extrude = printer.gcode_move.absolute_extrude %}
  ##### end of definitions #####
  {% if printer.toolhead.extruder != '' %}
    {% if printer[printer.toolhead.extruder].can_extrude %}
      {% if use_fw_retract %}
        {% if length < 0 %}
          G10
        {% else %}
          G11
        {% endif %}
      {% else %}
        M83
        G1 E{length} F{(speed | float | abs) * 60}
        {% if absolute_extrude %}
          M82
        {% endif %}
      {% endif %}
    {% else %}
      RESPOND TYPE=echo MSG='{"\"%s\" not hot enough" % printer.toolhead.extruder}'
    {% endif %}
  {% endif %}


[gcode_macro _CLIENT_RETRACT]
description: Retracts, if the extruder is hot enough
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
  {% set length = params.LENGTH | default(client.retract) | default(1.0) | float %}
  {% set speed = params.SPEED | default(client.speed_retract) | default(35) %}

  _CLIENT_EXTRUDE LENGTH=-{length | float | abs} SPEED={speed | float | abs}


[gcode_macro _CLIENT_LINEAR_MOVE]
description: Linear move with save and restore of the gcode state
gcode:
  {% set x_move = "X" ~ params.X if params.X is defined else "" %}
  {% set y_move = "Y" ~ params.Y if params.Y is defined else "" %}
  {% set z_move = "Z" ~ params.Z if params.Z is defined else "" %}
  {% set e_move = "E" ~ params.E if params.E is defined else "" %}
  {% set rate = "F" ~ params.F if params.F is defined else "" %}
  {% set ABSOLUTE = params.ABSOLUTE | default(0) | int != 0 %}
  {% set ABSOLUTE_E = params.ABSOLUTE_E | default(0) | int != 0 %}
  SAVE_GCODE_STATE NAME=_client_movement
  {% if x_move or y_move or z_move %}
    G9{ 0 if ABSOLUTE else 1 }
  {% endif %}
  {% if e_move %}
    M8{ 2 if ABSOLUTE_E else 3 }
  {% endif %}
  G1 { x_move } { y_move } { z_move } { e_move } { rate }
  RESTORE_GCODE_STATE NAME=_client_movement


# Thanks to Zero for this macro
[gcode_macro _WARP_STABILISE]
description: "Performs bed warp stabilisation based on the current bed temperature. Adjusts stabilisation time according to the bed temperature."
gcode:
  {% set bed_warp_stabilisation = printer['output_pin Bed_Warp_Stabilisation'].value == 1 %}
  {% if bed_warp_stabilisation %}
   {% set current_temp = params.CURRENT_TEMP|float %}
   {% set target_temp = params.TARGET_TEMP|float %}
   {% if current_temp < (target_temp * 0.99) %}
     {% set multiplier = printer["gcode_macro _START_END_PARAMS"].bed_warp_wait_multiplier|float %}
     {% set interval = printer["gcode_macro _START_END_PARAMS"].bed_warp_wait_interval|int %}
     {% set partial = printer["gcode_macro _START_END_PARAMS"].bed_warp_fraction_wait|float %}
     # if current temp is already pretty high, we only need to do a fraction of heat soaking
     {% if current_temp > (target_temp * partial) %}
       {% set total_time = ((target_temp - current_temp) * multiplier)|int %}
     {% else %}
       # 100c will be 13 minutes approx heat time, 65c will be 8.5 minutes preheat, etc.
       {% set total_time = (target_temp * multiplier)|int %}
     {% endif %}

     RESPOND TYPE=command MSG='Bed Warp Stabilisation starting with a total time of {total_time} seconds...'

     {% set loops = (total_time / interval)|int %}
     {% for i in range(loops) %}
       {% set time_remaining = total_time - (i + 1) * interval %}
       RESPOND TYPE=command MSG='Bed Warp Stabilization { time_remaining } seconds remaining'
       {% if time_remaining < interval %}
         G4 P{ time_remaining * 1000 }  # Wait for the interval time in milliseconds
       {% else %}
         G4 P{ interval * 1000 }  # Wait for the interval time in milliseconds
       {% endif %}
     {% endfor %}

     RESPOND TYPE=command MSG='Warp Stabilisation complete!'
    {% else %}
      RESPOND TYPE=command MSG='Skipping bed warp stabilisation as bed already at {current_temp}c'
    {% endif %}
  {% else %}
    RESPOND TYPE=command MSG='Skipping bed warp stabilisation - it is disabled'
  {% endif %}


# called in CANCEL_PRINT and END_PRINT to restore velocity set in START_PRINT
[gcode_macro _RESTORE_VELOCITY_ACCEL]
gcode:
  {% set max_velocity = printer.toolhead.max_velocity %}
  {% set max_accel = printer.toolhead.max_accel %}
  {% set square_corner_velocity = printer.toolhead.square_corner_velocity %}
  {% set start_max_velocity = printer["gcode_macro START_PRINT"].max_velocity %}
  {% set start_max_accel = printer["gcode_macro START_PRINT"].max_accel %}
  {% set start_square_corner_velocity = printer["gcode_macro START_PRINT"].square_corner_velocity %}
  {% if start_max_velocity > 0 and start_max_accel > 0 and start_square_corner_velocity > 0 and (max_velocity != start_max_velocity or max_accel != start_max_accel or square_corner_velocity != start_square_corner_velocity) %}
    RESPOND TYPE=command MSG='Restoring VELOCITY={start_max_velocity} (was {max_velocity}) ACCEL={start_max_accel} (was {max_accel}) SQUARE_CORNER_VELOCITY={start_square_corner_velocity} (was {square_corner_velocity})'
    SET_VELOCITY_LIMIT VELOCITY={start_max_velocity} ACCEL={start_max_accel} SQUARE_CORNER_VELOCITY={start_square_corner_velocity}
  {% endif %}


# =============================================================================
#  Adaptive Purge and Park (KAMP-derived)
# =============================================================================

# based on https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging
[gcode_macro _LINE_PURGE]
description: A purge macro that adapts to be near your actual printed objects
gcode:
    {% set travel_speed = (printer.toolhead.max_velocity) * 30 | float %}
    {% set z_height = printer["gcode_macro _KAMP_Settings"].line_purge_z_hop | float %}
    {% set purge_height = printer["gcode_macro _KAMP_Settings"].purge_height | float %}
    {% set tip_distance = printer["gcode_macro _KAMP_Settings"].tip_distance | float %}
    {% set purge_margin = printer["gcode_macro _KAMP_Settings"].purge_margin | float %}
    {% set purge_amount = printer["gcode_macro _KAMP_Settings"].purge_amount | float %}
    {% set retract_amount = printer["gcode_macro _KAMP_Settings"].line_purge_retract | float %}
    {% set retract_speed = (printer["gcode_macro _KAMP_Settings"].line_purge_retract_speed * 60) | float %}
    {% set flow_rate = printer["gcode_macro _KAMP_Settings"].flow_rate | float %}

    # Calculate purge origins and centers from objects
    {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}    # Get all object points
    {% set purge_x_min = (all_points | map(attribute=0) | min | default(0)) %}                          # Object x min
    {% set purge_x_max = (all_points | map(attribute=0) | max | default(0)) %}                          # Object x max
    {% set purge_y_min = (all_points | map(attribute=1) | min | default(0)) %}                          # Object y min
    {% set purge_y_max = (all_points | map(attribute=1) | max | default(0)) %}                          # Object y max

    {% set purge_x_center = ([((purge_x_max + purge_x_min) / 2) - (purge_amount / 2), 0] | max) %}      # Create center point of purge line relative to print on X axis
    {% set purge_y_center = ([((purge_y_max + purge_y_min) / 2) - (purge_amount / 2), 0] | max) %}      # Create center point of purge line relative to print on Y axis

    {% set purge_x_origin = ([purge_x_min - purge_margin, 0] | max) %}                                  # Add margin to x min, compare to 0, and choose the larger
    {% set purge_y_origin = ([purge_y_min - purge_margin, 0] | max) %}                                  # Add margin to y min, compare to 0, and choose the larger

    {% set purge_move_speed = (flow_rate / 5.0) * 60 | float %}

    {% if purge_y_origin > 0 %}
        {action_respond_info("Line purge starting at {}, {} and purging {}mm of filament, requested flow rate is {}mm3/s.".format(
            (purge_x_center),
            (purge_y_origin),
            (purge_amount),
            (flow_rate),
        )) }
    {% else %}
        {action_respond_info("Line purge starting at {}, {} and purging {}mm of filament, requested flow rate is {}mm3/s.".format(
            (purge_x_origin),
            (purge_y_center),
            (purge_amount),
            (flow_rate),
        )) }
    {% endif %}

    SAVE_GCODE_STATE NAME=Prepurge_State                                                    # Create gcode state

    {% if purge_y_origin > 0 %}                                                             # If there's room on Y, purge along X axis in front of print area
        G92 E0                                                                              # Reset extruder
        G0 F{travel_speed}                                                                  # Set travel speed
        G90                                                                                 # Absolute positioning
        G0 X{purge_x_center} Y{purge_y_origin}                                              # Move to purge position
        G0 Z{purge_height}                                                                  # Move to purge Z height
        M83                                                                                 # Relative extrusion mode
        G1 E{tip_distance} F{purge_move_speed}                                              # Move filament tip
        G1 X{purge_x_center + purge_amount} E{purge_amount} F{purge_move_speed}             # Purge line
        G1 E-{retract_amount} F{retract_speed}                                              # Retraction at end
        G0 X{purge_x_center + purge_amount + 10} F{travel_speed}                            # Rapid move to break string
        G92 E0                                                                              # Reset extruder distance
        M82                                                                                 # Absolute extrusion mode
        G0 Z{z_height} F{travel_speed}                                                      # Z hop
    {% else %}                                                                              # If there's room on X, purge along Y axis to the left of print area
        G92 E0                                                                              # Reset extruder
        G0 F{travel_speed}                                                                  # Set travel speed
        G90                                                                                 # Absolute positioning
        G0 X{purge_x_origin} Y{purge_y_center}                                              # Move to purge position
        G0 Z{purge_height}                                                                  # Move to purge Z height
        M83                                                                                 # Relative extrusion mode
        G1 E{tip_distance} F{purge_move_speed}                                              # Move filament tip
        G1 Y{purge_y_center + purge_amount} E{purge_amount} F{purge_move_speed}             # Purge line
        G1 E-{retract_amount} F{retract_speed}                                              # Retraction at end
        G0 Y{purge_y_center + purge_amount + 10} F{travel_speed}                            # Rapid move to break string
        G92 E0                                                                              # Reset extruder distance
        M82                                                                                 # Absolute extrusion mode
        G0 Z{z_height} F{travel_speed}                                                      # Z hop
    {% endif %}

    RESTORE_GCODE_STATE NAME=Prepurge_State                                                 # Restore gcode state


# based on https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging
# modified to park over the start of the Line_Purge position always
[gcode_macro _SMART_PARK]
description: Parks your printhead over the start of line purge
gcode:
    # Get relevant printer params
    {% set travel_speed = (printer.toolhead.max_velocity) * 30 | float %}

    # Get purge settings from _Kamp_Settings
    {% set z_height = printer["gcode_macro _KAMP_Settings"].smart_park_height | float %}
    {% set purge_margin = printer["gcode_macro _KAMP_Settings"].purge_margin | float %}
    {% set purge_amount = printer["gcode_macro _KAMP_Settings"].purge_amount | float %}

    # Calculate purge origins and centers from objects
    {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}    # Get all object points
    {% set purge_x_min = (all_points | map(attribute=0) | min | default(0)) %}                          # Object x min
    {% set purge_x_max = (all_points | map(attribute=0) | max | default(0)) %}                          # Object x max
    {% set purge_y_min = (all_points | map(attribute=1) | min | default(0)) %}                          # Object y min
    {% set purge_y_max = (all_points | map(attribute=1) | max | default(0)) %}                          # Object y max

    {% set purge_x_center = ([((purge_x_max + purge_x_min) / 2) - (purge_amount / 2), 0] | max) %}      # Create center point of purge line relative to print on X axis
    {% set purge_y_center = ([((purge_y_max + purge_y_min) / 2) - (purge_amount / 2), 0] | max) %}      # Create center point of purge line relative to print on Y axis

    {% set purge_x_origin = ([purge_x_min - purge_margin, 0] | max) %}                                  # Add margin to x min, compare to 0, and choose the larger
    {% set purge_y_origin = ([purge_y_min - purge_margin, 0] | max) %}                                  # Add margin to y min, compare to 0, and choose the larger

    {% if purge_y_origin > 0 %}
      { action_respond_info("Smart Park location: {},{}.".format(
            (purge_x_center),
            (purge_y_origin),
        )) }
    {% else %}
        { action_respond_info("Smart Park location: {},{}.".format(
            (purge_x_origin),
            (purge_y_center),
        )) }
    {% endif %}

    SAVE_GCODE_STATE NAME=Prepurge_State                                                    # Create gcode state

    {% if purge_y_origin > 0 %}                                                             # If there's room on Y, will purge along X axis in front of print area
        G92 E0                                                                              # Reset extruder
        G0 F{travel_speed}                                                                  # Set travel speed
        G90                                                                                 # Absolute positioning
        G0 X{purge_x_center} Y{purge_y_origin}                                              # Move to purge position
        G0 Z{z_height}                                                                  # Move to purge Z height
    {% else %}                                                                              # If there's room on X, will purge along Y axis to the left of print area
        G92 E0                                                                              # Reset extruder
        G0 F{travel_speed}                                                                  # Set travel speed
        G90                                                                                 # Absolute positioning
        G0 X{purge_x_origin} Y{purge_y_center}                                              # Move to purge position
        G0 Z{z_height}                                                                  # Move to purge Z height
    {% endif %}

    RESTORE_GCODE_STATE NAME=Prepurge_State                                                 # Restore gcode state
