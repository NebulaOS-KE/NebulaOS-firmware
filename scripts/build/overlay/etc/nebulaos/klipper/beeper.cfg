# NebulaOS Ender-3 V3 KE buzzer / beeper macros.
#
# IMMUTABLE, SLOT/IMAGE OWNED. The KE buzzer is a passive piezo on GPIO
# PC03 (PWM channel 3). The nebulabeep binary (built from GuppyScreen's
# guppybeep.c) drives it via hardware PWM
# (zero CPU, print-safe), so S (frequency) and P (duration) produce real
# pitch. It restores PC03 to GPIO on exit so /usr/bin/beep still works.
#
# Derived from: GuppyScreen guppy_cmd.cfg buzzer section (M300, BEEP,
# PLAY_TUNE macros retained unchanged; GuppyScreen config dependency
# removed).

[gcode_shell_command nebulabeep]
command: /opt/nebulascreen/nebulabeep
timeout: 120.0
verbose: False

# The pre-Run 15 name, kept for users' own macros (RUN_SHELL_COMMAND
# CMD=guppybeep); same program, same settings.
[gcode_shell_command guppybeep]
command: /opt/nebulascreen/nebulabeep
timeout: 120.0
verbose: False

# M300 S<freq Hz> P<duration ms> — standard slicer/gcode beep with real pitch.
[gcode_macro M300]
description: Beep the buzzer (S=frequency Hz, P=duration ms) via hardware PWM
gcode:
  {% set s = params.S|default(1000)|int %}
  {% set p = params.P|default(100)|int %}
  RUN_SHELL_COMMAND CMD=nebulabeep PARAMS="m300 S{s} P{p}"

[gcode_macro BEEP]
description: Short confirmation beep
gcode:
  M300 S2000 P120

# PLAY_TUNE SONG=<name> plays a song defined in songs.conf (in the config
# dir, editable + preserved across reinstalls). RTTTL=<string> plays a
# one-off custom tune inline — that string must have no spaces and use 's'
# for sharps (e.g. 'as' not 'a#'), because Klipper's gcode parser treats
# '#' as a comment. Songs in songs.conf may use standard '#' since they're
# read directly by the player. Tunes block until finished, so use them for
# idle events (print complete) not mid-print.
[gcode_macro PLAY_TUNE]
description: Play a song from songs.conf (SONG=name) or an inline RTTTL=<string>
gcode:
  {% set song = params.SONG|default("mario")|string|lower %}
  {% set rtttl = params.RTTTL|default("")|string %}
  {% if rtttl != "" %}
    RUN_SHELL_COMMAND CMD=nebulabeep PARAMS="rtttl {rtttl}"
  {% else %}
    RUN_SHELL_COMMAND CMD=nebulabeep PARAMS="song {song} /opt/printer_data/config/songs.conf"
  {% endif %}
