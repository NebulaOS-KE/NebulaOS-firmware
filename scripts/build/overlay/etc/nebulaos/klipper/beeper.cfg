# NebulaOS Ender-3 V3 KE buzzer / beeper macros.
#
# IMMUTABLE, SLOT/IMAGE OWNED. The KE buzzer is a passive piezo on GPIO
# PC03 = PWM channel 3. The NebulaOS kernel muxes PC03 to the PWM function
# and exposes the channel as /sys/class/pwm/pwmchip0/pwm3; Klipper owns it
# through the [nebulaos_beeper] extra (NebulaOS-klipper-extensions), which
# plays every sound from the Klippy reactor at the print position of the
# command - M300, BEEP and PLAY_TUNE never hold the G-code queue, so a tune
# during a print does not stall it. No shell command, no /dev/mem (G108).
#
# Why not an upstream [output_pin] with hardware_pwm on host:pwmchip0/pwm3:
# Klipper's Linux host MCU writes the PWM period once at startup and SET_PIN
# cannot change it, so the buzzer could play only one fixed pitch.
#
# Macro names are unchanged from the GuppyScreen guppy_cmd.cfg buzzer
# section they were derived from. The screen's touch click uses the same
# owner (API endpoint nebulaos_beeper/click).

[nebulaos_beeper]
# Defaults (see the extra's header): pwmchip /sys/class/pwm/pwmchip0,
# channel 3, songs_file /opt/printer_data/config/songs.conf, duty 0.5,
# click 260 Hz / 4 ms / duty 0.02, max_tune_seconds 120,
# max_tune_seconds_printing 20.

# M300 S<freq Hz> P<duration ms> - standard slicer/G-code beep with real
# pitch. S0 is a rest of P ms. Consecutive M300s play one after another.
[gcode_macro M300]
description: Beep the buzzer (S=frequency Hz, P=duration ms)
gcode:
  {% set s = params.S|default(1000)|int %}
  {% set p = params.P|default(100)|int %}
  NEBULAOS_BEEP FREQ={s} DURATION={p}

[gcode_macro BEEP]
description: Short confirmation beep
gcode:
  M300 S2000 P120

# PLAY_TUNE SONG=<name> plays a song defined in songs.conf (in the config
# dir, editable + preserved across reinstalls). RTTTL=<string> plays a
# one-off custom tune inline - that string must have no spaces and use 's'
# for sharps (e.g. 'as' not 'a#'), because Klipper's G-code parser treats
# '#' as a comment. Songs in songs.conf may use standard '#'. Tunes play in
# the background (the print continues); while printing they are cut to
# 20 s. NEBULAOS_BEEPER_STOP silences the buzzer.
[gcode_macro PLAY_TUNE]
description: Play a song from songs.conf (SONG=name) or an inline RTTTL=<string>
gcode:
  {% set song = params.SONG|default("mario")|string|lower %}
  {% set rtttl = params.RTTTL|default("")|string %}
  {% if rtttl != "" %}
    NEBULAOS_PLAY_TUNE RTTTL="{rtttl}"
  {% else %}
    NEBULAOS_PLAY_TUNE SONG="{song}"
  {% endif %}

