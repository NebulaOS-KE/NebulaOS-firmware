# NebulaOS-managed Moonraker sections (GUI/service readiness mission,
# 2026-10-09). IMAGE OWNED: lives on the read-only rootfs and is pulled in by
# klipper-pin.conf, which every provisioned moonraker.conf already includes -
# so existing devices get these sections with the image, and an A/B rollback
# removes them with the rootfs, without any user file being rewritten.

# OS settings for GuppyScreen and other clients (machine.nebulaos.*), backed
# by /usr/libexec/nebulaos/nebulaos-osconfig. The component itself is composed
# into the Moonraker checkout by S05nebulaos-activate.
[nebulaos]

# <hostname>.local and _moonraker._tcp discovery through python-zeroconf, which
# Moonraker already ships - no Avahi, no extra daemon.
[zeroconf]
