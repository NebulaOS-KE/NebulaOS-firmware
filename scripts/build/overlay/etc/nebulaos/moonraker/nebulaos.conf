# NebulaOS-managed Moonraker sections (GUI/service readiness mission,
# 2026-10-09). IMAGE OWNED: lives on the read-only rootfs and is pulled in by
# klipper-pin.conf, which every provisioned moonraker.conf already includes -
# so existing devices get these sections with the image, and an A/B rollback
# removes them with the rootfs, without any user file being rewritten.

# OS settings for GuppyScreen and other clients (machine.nebulaos.*), backed
# by /usr/libexec/nebulaos/nebulaos-osconfig. The component itself is composed
# into the Moonraker checkout by S05nebulaos-activate.
[nebulaos]

# <hostname>.local and _moonraker._tcp discovery through python-zeroconf, which
# Moonraker already ships - no Avahi, no extra daemon.
[zeroconf]

# G84 (Run 13, 2026-10-18): OctoPrint-compatible API, so slicers that upload
# the OctoPrint way (OrcaSlicer "Octo/Klipper", PrusaSlicer, Cura) work out of
# the box at http://<printer> - nginx on port 80 already forwards /api to
# Moonraker. Moonraker merges a section repeated in another file (a user's
# own [octoprint_compat] in moonraker.conf adds to or overrides this one).
[octoprint_compat]

# G82 stage 4: NebulaScreen updates ([update_manager nebulascreen], type: zip,
# path /usr/data/nebulaos/apps/nebulascreen, managed_services nebulascreen).
# The section lives in its own image-owned file. It was dormant until the
# screen repository was renamed to NebulaOS-KE/NebulaOS-nebulascreen and its
# first stable release was published (without a release, Moonraker's "Update
# all" - machine.update.full - would stop at this component and never update
# Klipper or Moonraker). Active since Run 19 (2026-10-24): both hold.
[include /etc/nebulaos/moonraker/nebulascreen-update.conf]

# Timelapse (2026-10-31): upstream moonraker-timelapse, composed like
# [nebulaos]. Only fixed paths here - a setting in this file is locked in
# Mainsail's Timelapse settings. "Off by default" and the light x264 preset
# are set once through the component's own settings API by
# /usr/libexec/nebulaos-seed-timelapse, so users can change them.
# Frames go to the data partition (not tmpfs: RAM is 256 MB).
[timelapse]
output_path: /opt/printer_data/timelapse/
frame_path: /opt/printer_data/misc/timelapse-frames/
ffmpeg_binary_path: /usr/bin/ffmpeg
