# NebulaScreen updates through Moonraker's update_manager (G82 stage 4).
# IMAGE OWNED: on the read-only rootfs, next to nebulaos.conf.
#
# ACTIVE since Run 19 (2026-10-24): nebulaos.conf includes this file. It was
# dormant until BOTH of these held (reasons below, kept as the record):
#   1. the GitHub repository was renamed coreflake1/NebulaOS-guppyscreen ->
#      coreflake1/NebulaOS-nebulascreen (R1, done by a human; never recreate
#      the old name - GitHub's redirect keeps old builds reproducible);
#   2. a first stable release (v0.9.0, made by the screen repo's tag CI, one
#      zip asset; release name == tag == release_info.json "version") is
#      published there.
#
# Why it had to wait - read from vendor/moonraker (pin d5ee171), not assumed:
#   - update_manager/net_deploy.py _validate_release_info(): for a valid
#     install, the repo Moonraker queries comes from release_info.json
#     (project_owner/project_name), NOT from "repo:" below; a different
#     "repo:" only adds a permanent anomaly warning. Every NebulaScreen
#     release_info.json (and the image seed) names NebulaOS-nebulascreen, so
#     before the rename every check was a GitHub 404.
#   - With no release, NetDeploy.update() raises "Unable to locate update".
#     A single-component update just fails, but update_manager.py
#     _handle_full_update_request() ("Update all" in Mainsail,
#     machine.update.full) updates clients first and aborts at the first
#     exception - Klipper and Moonraker would then never be updated. The
#     refresh path catches per-component errors (NetDeploy.refresh logs and
#     continues). With a stable release published, "Update all" reaches
#     nebulascreen, finds it up to date (remote "name" == local version) or
#     updates it, and goes on to Klipper and Moonraker as before.
#   - Valid install: S58 (ns_image_wins / ns_reset_to_image) keeps at least
#     the image's release_info.json in path, so the install is never
#     "Invalid install detected" (which would also abort "Update all").

# What it does: Moonraker downloads the release zip into
# /usr/data/nebulaos/apps/nebulascreen (it replaces the whole directory) and
# restarts the service "nebulascreen" (supervisorctl shim ->
# /etc/init.d/S58nebulascreen restart; S56moonraker puts nebulascreen in
# moonraker.asvc). S58 binds a download only after the NebulaOS update
# supervisor checked and approved it; until then the image's own screen runs.
# The supervisor then activates it on an idle printer, health-checks it and
# rolls back (last-known-good release, else the image's screen).
#
# During a print (Run 19 architect B3, recorded so nobody over-claims):
# Moonraker refuses a single-component update while printing, but "Update
# all" has no print check and a PAUSED print counts as not printing. Then the
# zip is downloaded and the screen service restarts - deliberately NOT gated
# by the supervisorctl shim (G91 design v3.1, RC1: a screen restart never
# touches the print, and the screen's own Restart button uses the shim). The
# restarted screen is still the approved one: the new release is activated
# only by the supervisor, which defers while busy. The print is never cut.
#
# No refresh_interval: like every other [update_manager ...] section here,
# the default applies ([update_manager] enable_auto_refresh: False in
# moonraker.conf - checks are user-triggered).
[update_manager nebulascreen]
type: zip
channel: stable
repo: coreflake1/NebulaOS-nebulascreen
path: /usr/data/nebulaos/apps/nebulascreen
managed_services: nebulascreen
