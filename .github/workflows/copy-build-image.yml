name: Copy build environment image

# Run 23 (2026-10-29): the repositories moved from coreflake1 to the
# NebulaOS-KE organisation. A container package does not move with its
# repository, so the canonical build image is copied BY DIGEST to
# ghcr.io/nebulaos-ke/nebulaos-build. crane copies the manifest bytes as they
# are: the digest - and so every build pinned to it - stays the same. Never
# tags :latest.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "source image by digest"
        required: true
        default: "ghcr.io/coreflake1/nebulaos-build@sha256:a6ba57c69fa1ea630b037a1d1f55cf0c044a7f5a403bde9b155ea54bca1cceba"
      tag:
        description: "tag in ghcr.io/nebulaos-ke/nebulaos-build"
        required: true
        default: "canonical-a6ba57c69fa1"

permissions:
  contents: read
  packages: write

jobs:
  copy:
    runs-on: ubuntu-24.04
    steps:
      - uses: imjasonh/setup-crane@v0.4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Copy by digest
        env:
          SOURCE: ${{ inputs.source }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$SOURCE" in *@sha256:*) ;; *) echo "source must be pinned by digest" >&2; exit 1 ;; esac
          want=${SOURCE#*@}
          crane copy "$SOURCE" "ghcr.io/nebulaos-ke/nebulaos-build:$TAG"
          got=$(crane digest "ghcr.io/nebulaos-ke/nebulaos-build:$TAG")
          echo "source digest $want"
          echo "copied digest $got"
          [ "$got" = "$want" ] || { echo "DIGEST CHANGED - not the same image" >&2; exit 1; }
          echo "\`ghcr.io/nebulaos-ke/nebulaos-build@$got\` (tag $TAG)" >> "$GITHUB_STEP_SUMMARY"
